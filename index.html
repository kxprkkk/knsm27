<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Konsumpcja</title>
  <meta name="description" content="Lista rzeczy do kupienia i miesięczny budżet na przyjemności. Wszystko zapisane na Twoim urządzeniu." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F2F2F7" id="meta-theme" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Konsumpcja" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <style>
    /* ============================================================
       Tokeny
       ============================================================ */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --bg: #F2F2F7;
      --surface: #FFFFFF;
      --fill: rgba(120, 120, 128, 0.12);
      --fill-strong: rgba(120, 120, 128, 0.22);
      --label: #000000;
      --label-2: #5E5E63;
      --label-3: #A1A1A6;
      --separator: rgba(60, 60, 67, 0.17);

      --accent: #007AFF;
      --accent-text: #0062CC;
      --accent-soft: rgba(0, 122, 255, 0.12);
      --green: #34C759;
      --green-text: #1E7B34;
      --red: #FF3B30;
      --red-text: #D70015;
      --red-soft: rgba(255, 59, 48, 0.12);

      --lvl-0: rgba(120, 120, 128, 0.14);
      --lvl-1: rgba(52, 199, 89, 0.30);
      --lvl-2: rgba(52, 199, 89, 0.62);
      --lvl-3: #34C759;

      --glass: rgba(250, 250, 252, 0.74);
      --glass-edge: rgba(255, 255, 255, 0.75);
      --seg-thumb: #FFFFFF;
      --scrim: rgba(0, 0, 0, 0.28);
      --shadow-float: 0 10px 30px rgba(0, 0, 0, 0.10), 0 1px 3px rgba(0, 0, 0, 0.06);
      --toast-bg: rgba(28, 28, 30, 0.94);

      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

      --radius-card: 1.15rem;
      --tabbar-h: 3.75rem;
      --content-w: 34rem;
    }

    html[data-theme="dark"] {
      --bg: #000000;
      --surface: #1C1C1E;
      --fill: rgba(120, 120, 128, 0.24);
      --fill-strong: rgba(120, 120, 128, 0.38);
      --label: #FFFFFF;
      --label-2: #AEAEB2;
      --label-3: #636366;
      --separator: rgba(84, 84, 88, 0.6);
      --accent: #0A84FF;
      --accent-text: #4DA3FF;
      --accent-soft: rgba(10, 132, 255, 0.22);
      --green: #30D158;
      --green-text: #30D158;
      --red: #FF453A;
      --red-text: #FF6961;
      --red-soft: rgba(255, 69, 58, 0.2);
      --lvl-0: rgba(120, 120, 128, 0.26);
      --lvl-1: rgba(48, 209, 88, 0.32);
      --lvl-2: rgba(48, 209, 88, 0.64);
      --lvl-3: #30D158;
      --glass: rgba(38, 38, 40, 0.74);
      --glass-edge: rgba(255, 255, 255, 0.10);
      --seg-thumb: #636366;
      --scrim: rgba(0, 0, 0, 0.5);
      --shadow-float: 0 10px 30px rgba(0, 0, 0, 0.5);
      --toast-bg: rgba(58, 58, 60, 0.96);
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --bg: #000000;
        --surface: #1C1C1E;
        --fill: rgba(120, 120, 128, 0.24);
        --fill-strong: rgba(120, 120, 128, 0.38);
        --label: #FFFFFF;
        --label-2: #AEAEB2;
        --label-3: #636366;
        --separator: rgba(84, 84, 88, 0.6);
        --accent: #0A84FF;
        --accent-text: #4DA3FF;
        --accent-soft: rgba(10, 132, 255, 0.22);
        --green: #30D158;
        --green-text: #30D158;
        --red: #FF453A;
        --red-text: #FF6961;
        --red-soft: rgba(255, 69, 58, 0.2);
        --lvl-0: rgba(120, 120, 128, 0.26);
        --lvl-1: rgba(48, 209, 88, 0.32);
        --lvl-2: rgba(48, 209, 88, 0.64);
        --lvl-3: #30D158;
        --glass: rgba(38, 38, 40, 0.74);
        --glass-edge: rgba(255, 255, 255, 0.10);
        --seg-thumb: #636366;
        --scrim: rgba(0, 0, 0, 0.5);
        --shadow-float: 0 10px 30px rgba(0, 0, 0, 0.5);
        --toast-bg: rgba(58, 58, 60, 0.96);
      }
    }

    /* Kolory okresów (kolory systemowe iOS) */
    .pc-amber  { --pc: #FF9500; --pc-soft: rgba(255, 149, 0, 0.18);  --pc-text: #A35200; }
    .pc-sky    { --pc: #32ADE6; --pc-soft: rgba(50, 173, 230, 0.18); --pc-text: #006E9C; }
    .pc-purple { --pc: #AF52DE; --pc-soft: rgba(175, 82, 222, 0.16); --pc-text: #8A35BC; }
    .pc-rose   { --pc: #FF2D55; --pc-soft: rgba(255, 45, 85, 0.14);  --pc-text: #CC1440; }
    .pc-teal   { --pc: #00C7BE; --pc-soft: rgba(0, 199, 190, 0.18);  --pc-text: #00736D; }
    html[data-theme="dark"] .pc-amber  { --pc-text: #FFB340; }
    html[data-theme="dark"] .pc-sky    { --pc-text: #70D7FF; }
    html[data-theme="dark"] .pc-purple { --pc-text: #DA8FFF; }
    html[data-theme="dark"] .pc-rose   { --pc-text: #FF6482; }
    html[data-theme="dark"] .pc-teal   { --pc-text: #66D4CF; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) .pc-amber  { --pc-text: #FFB340; }
      html:not([data-theme="light"]) .pc-sky    { --pc-text: #70D7FF; }
      html:not([data-theme="light"]) .pc-purple { --pc-text: #DA8FFF; }
      html:not([data-theme="light"]) .pc-rose   { --pc-text: #FF6482; }
      html:not([data-theme="light"]) .pc-teal   { --pc-text: #66D4CF; }
    }

    /* ============================================================
       Podstawy. Rozmiar tekstu idzie za ustawieniem iOS.
       ============================================================ */
    html {
      font-size: 106.25%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      background: var(--bg);
    }
    @supports (font: -apple-system-body) {
      html { font: -apple-system-body; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: 1rem;
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
    }
    html.locked, html.locked body { overflow: hidden; }
    h1, h2, h3, p, ul { margin: 0; padding: 0; }
    ul { list-style: none; }
    svg { display: block; }
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      text-align: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    button:disabled { cursor: default; opacity: 0.35; }
    input, select, textarea { font: inherit; font-size: max(1rem, 16px); color: var(--label); }
    :focus { outline: none; }
    :focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    .ic { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }

    /* ============================================================
       Pasek górny i duży tytuł
       ============================================================ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      padding-top: var(--safe-top);
    }
    .topbar::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--glass);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 0.5px 0 var(--separator);
      opacity: 0;
      transition: opacity 200ms ease;
    }
    html.scrolled .topbar::before { opacity: 1; }
    .topbar-inner {
      position: relative;
      max-width: var(--content-w);
      height: 3.25rem;
      margin: 0 auto;
      padding: 0 0.75rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.5rem;
    }
    .topbar-side { display: flex; align-items: center; gap: 0.5rem; }
    .topbar-side.end { justify-content: flex-end; }
    .topbar-title {
      max-width: 50vw;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transform: translateY(0.25rem);
      transition: opacity 200ms ease, transform 240ms var(--ease-out);
    }
    html.scrolled .topbar-title { opacity: 1; transform: none; }

    .nav-btn {
      min-width: 2.6rem;
      height: 2.6rem;
      padding: 0 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      backdrop-filter: blur(16px) saturate(180%);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08), inset 0 0 0 0.5px var(--glass-edge);
      color: var(--accent-text);
      font-weight: 600;
      font-size: 0.94rem;
      transition: transform 160ms var(--ease-out);
    }
    .nav-btn.icon { width: 2.6rem; padding: 0; }
    .nav-btn .ic { width: 1.3rem; height: 1.3rem; stroke-width: 2.3; }
    .nav-btn:active { transform: scale(0.92); }

    .large-title {
      max-width: var(--content-w);
      margin: 0 auto;
      padding: 0 1.25rem 1rem;
    }
    .large-title h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.022em;
      line-height: 1.12;
    }
    .large-title p { margin-top: 0.15rem; color: var(--label-2); font-size: 0.94rem; }

    main {
      max-width: var(--content-w);
      margin: 0 auto;
      padding: 0 1rem calc(var(--tabbar-h) + var(--safe-bottom) + 2.5rem);
    }

    /* ============================================================
       Sekcje, karty, listy
       ============================================================ */
    .section { margin-bottom: 1.75rem; }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0 0.25rem 0.5rem;
    }
    .section-title { font-size: 1.18rem; font-weight: 700; letter-spacing: -0.01em; }
    .section-action {
      padding: 0.5rem 0.4rem;
      margin: -0.5rem -0.4rem;
      color: var(--accent-text);
      font-size: 0.94rem;
    }
    .group-label { padding: 0 1rem 0.4rem; font-size: 0.8rem; color: var(--label-2); }
    .group-note { padding: 0.5rem 1rem 0; font-size: 0.8rem; line-height: 1.38; color: var(--label-2); }
    .group { margin-bottom: 1.75rem; }

    .card {
      background: var(--surface);
      border-radius: var(--radius-card);
      overflow: hidden;
    }
    .card + .card { margin-top: 1rem; }
    .section > .card + .card, .sheet-body .card { margin-top: 0; }
    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.9rem 1rem 0.5rem;
    }
    .card-title { font-size: 1rem; font-weight: 600; }
    .card-sub { margin-top: 0.1rem; font-size: 0.8rem; color: var(--label-2); }
    .card-empty { padding: 0.25rem 1rem 1rem; color: var(--label-2); font-size: 0.94rem; }
    .badge {
      flex-shrink: 0;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: var(--fill);
      font-size: 0.8rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .list > li { position: relative; }
    .list > li + li::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      left: var(--sep, 1rem);
      border-top: 0.5px solid var(--separator);
      pointer-events: none;
    }
    .list.with-check { --sep: 3.65rem; }

    .row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-height: 2.85rem;
      padding: 0.55rem 1rem;
      transition: background-color 300ms ease;
    }
    .row:has(> .row-main:active) { background: var(--fill); transition: none; }
    .row-main {
      flex: 1;
      min-width: 0;
      align-self: stretch;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: -0.55rem -1rem -0.55rem 0;
      padding: 0.55rem 1rem 0.55rem 0;
    }
    .row > .row-main:first-child { margin-left: -1rem; padding-left: 1rem; }
    .row-text { flex: 1; min-width: 0; display: block; }
    .row-title { display: block; line-height: 1.25; overflow-wrap: anywhere; }
    .row-title.accent { color: var(--accent-text); }
    .row-title.danger { color: var(--red-text); }
    .row-title.muted, .row.is-done .row-title { color: var(--label-2); }
    .row-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15rem 0.6rem;
      margin-top: 0.18rem;
      font-size: 0.8rem;
      line-height: 1.3;
      color: var(--label-2);
    }
    .meta-item { display: inline-flex; align-items: center; gap: 0.25rem; }
    .meta-item .ic { width: 0.85rem; height: 0.85rem; }
    .meta-alert { color: var(--red-text); font-weight: 600; }
    .row-value { flex-shrink: 0; color: var(--label-2); font-size: 0.94rem; }
    .chev { width: 0.95rem; height: 0.95rem; color: var(--label-3); stroke-width: 2.4; }
    @media (hover: hover) and (pointer: fine) {
      .row:has(> .row-main:hover) { background: var(--fill); }
    }

    /* Odhaczanie */
    .check {
      flex-shrink: 0;
      width: 2.75rem;
      height: 2.75rem;
      margin: -0.5rem -0.25rem -0.5rem -0.6rem;
      display: grid;
      place-items: center;
    }
    .check-ring {
      width: 1.55rem;
      height: 1.55rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid var(--label-3);
      transition: background-color 180ms ease, border-color 180ms ease, transform 160ms var(--ease-out);
    }
    .check.square .check-ring { border-radius: 0.45rem; }
    .check .ic {
      width: 0.95rem;
      height: 0.95rem;
      color: #FFFFFF;
      stroke-width: 3;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 150ms ease, transform 220ms var(--ease-out);
    }
    .check.is-important .check-ring { border-color: var(--accent); }
    .check.is-missed .check-ring { border-color: var(--red); }
    .check[aria-checked="true"] .check-ring { background: var(--green); border-color: var(--green); }
    .check[aria-checked="true"] .ic { opacity: 1; transform: none; }
    .check:active .check-ring { transform: scale(0.84); transition-duration: 80ms; }

    /* Postęp dnia */
    .progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.1rem;
      margin-bottom: 1.75rem;
    }
    .progress-count {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      font-variant-numeric: tabular-nums;
    }
    .progress-count .of { color: var(--label-2); font-weight: 600; }
    .progress-note { margin-top: 0.1rem; font-size: 0.88rem; color: var(--label-2); }
    .progress-plain { font-weight: 600; }
    .ring { position: relative; width: 3.4rem; height: 3.4rem; flex-shrink: 0; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-track { stroke: var(--fill-strong); }
    .ring-value { stroke: var(--accent); transition: stroke-dashoffset 600ms var(--ease-out), stroke 300ms ease; }
    .ring.full .ring-value { stroke: var(--green); }
    .ring.zero .ring-value { opacity: 0; }
    .ring-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 0.74rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Okresy jako pasek informacyjny */
    .strips { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; }
    .strip {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 0.8rem 0.65rem 0.9rem;
      border-radius: 0.95rem;
      background: var(--pc-soft);
      color: var(--pc-text);
      font-size: 0.88rem;
      transition: transform 160ms var(--ease-out);
    }
    .strip:active { transform: scale(0.98); }
    .strip .chev { color: currentColor; opacity: 0.6; }
    .strip-text { flex: 1; min-width: 0; }
    .strip-note { display: block; margin-top: 0.1rem; opacity: 0.85; }
    .dot-pc { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--pc); flex-shrink: 0; }

    /* Pusty stan */
    .empty { padding: 2.25rem 1.5rem; text-align: center; }
    .empty h2 { font-size: 1.18rem; font-weight: 700; }
    .empty p { max-width: 19rem; margin: 0.4rem auto 1.25rem; color: var(--label-2); font-size: 0.94rem; line-height: 1.4; }

    /* ============================================================
       Przyciski i kontrolki
       ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-height: 2.75rem;
      padding: 0 1.25rem;
      border-radius: 999px;
      font-weight: 600;
      transition: transform 160ms var(--ease-out);
    }
    .btn:active { transform: scale(0.96); }
    .btn-sm { min-height: 2.25rem; padding: 0 0.95rem; font-size: 0.88rem; }
    .btn-block { width: 100%; }
    .btn-filled { background: var(--accent); color: #FFFFFF; }
    .btn-tinted { background: var(--accent-soft); color: var(--accent-text); }
    .btn-gray { background: var(--fill); color: var(--label); }
    .btn-danger { background: var(--red); color: #FFFFFF; }

    .icon-btn {
      flex-shrink: 0;
      width: 2.5rem;
      height: 2.5rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--accent-text);
    }
    .icon-btn:active { background: var(--fill); }
    .icon-btn.sm { width: 2.2rem; height: 2.2rem; color: var(--label-2); }
    .icon-btn.sm .ic { width: 1rem; height: 1rem; }
    .icon-btn.del span {
      width: 1.45rem;
      height: 1.45rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--red);
      color: #FFFFFF;
    }
    .icon-btn.del .ic { width: 0.9rem; height: 0.9rem; stroke-width: 3; }

    .switch {
      position: relative;
      flex-shrink: 0;
      width: 3.1rem;
      height: 1.9rem;
      border-radius: 999px;
      background: var(--fill-strong);
      transition: background-color 220ms ease;
    }
    .switch::before { content: ""; position: absolute; inset: -0.5rem; }
    .switch::after {
      content: "";
      position: absolute;
      top: 0.12rem;
      left: 0.12rem;
      width: 1.66rem;
      height: 1.66rem;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16);
      transition: transform 280ms var(--ease-drawer);
    }
    .switch[aria-checked="true"] { background: var(--green); }
    .switch[aria-checked="true"]::after { transform: translateX(1.2rem); }

    .seg {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: repeat(var(--n), 1fr);
      padding: 0.125rem;
      border-radius: 0.6rem;
      background: var(--fill);
    }
    .seg-thumb {
      position: absolute;
      z-index: -1;
      top: 0.125rem;
      bottom: 0.125rem;
      left: 0.125rem;
      width: calc((100% - 0.25rem) / var(--n));
      border-radius: 0.5rem;
      background: var(--seg-thumb);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
      transform: translateX(calc(100% * var(--i)));
      transition: transform 300ms var(--ease-drawer);
    }
    .seg button {
      min-height: 2rem;
      padding: 0.3rem 0.4rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }
    .seg button[aria-pressed="true"] { font-weight: 600; }
    .seg:has(button:disabled) { opacity: 0.45; }
    .seg button:disabled { opacity: 1; }
    .seg-wrap { margin-bottom: 1rem; }

    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.35rem; }
    .times { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.35rem; }
    .day-chip {
      height: 2.6rem;
      border-radius: 0.7rem;
      background: var(--fill);
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      transition: background-color 160ms ease, color 160ms ease, transform 160ms var(--ease-out);
    }
    .day-chip:active { transform: scale(0.94); }
    .day-chip[aria-pressed="true"] { background: var(--accent); color: #FFFFFF; }

    /* Pola formularzy w kartach */
    .field { padding: 0 1rem; }
    .field + .field { border-top: 0.5px solid var(--separator); }
    .field-stack { display: flex; flex-direction: column; gap: 0.6rem; padding: 0.75rem 1rem; }
    .field-label { font-size: 0.8rem; color: var(--label-2); }
    .input {
      width: 100%;
      min-height: 2.85rem;
      padding: 0.6rem 0;
      border: 0;
      background: transparent;
    }
    .input::placeholder { color: var(--label-3); }
    .input-time, .select {
      flex-shrink: 0;
      min-height: 2.25rem;
      padding: 0.35rem 0.7rem;
      border: 0;
      border-radius: 0.55rem;
      background: var(--fill);
      color: var(--label);
      font-variant-numeric: tabular-nums;
      -webkit-appearance: none;
      appearance: none;
    }
    .input-time { min-width: 5.6rem; text-align: center; }
    .input-time::-webkit-date-and-time-value { text-align: center; }
    .select { max-width: 13rem; padding-right: 0.8rem; text-overflow: ellipsis; }
    .input-time:focus-visible, .select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .alert {
      margin-bottom: 1rem;
      padding: 0.7rem 0.9rem;
      border-radius: 0.8rem;
      background: var(--red-soft);
      color: var(--red-text);
      font-size: 0.88rem;
      font-weight: 500;
    }
    .notice {
      margin-bottom: 1rem;
      padding: 0.65rem 0.9rem;
      border-radius: 0.8rem;
      background: var(--fill);
      color: var(--label-2);
      font-size: 0.88rem;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 1.25rem; }
    .chip {
      min-height: 2.25rem;
      padding: 0 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      border-radius: 999px;
      background: var(--surface);
      font-size: 0.88rem;
      font-weight: 500;
      transition: transform 160ms var(--ease-out);
    }
    .chip:active { transform: scale(0.95); }
    .chips-label { margin: 0 0.25rem 0.5rem; font-size: 0.8rem; color: var(--label-2); }

    .swatches { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .swatch {
      width: 2.75rem;
      height: 2.75rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }
    .swatch span {
      width: 1.9rem;
      height: 1.9rem;
      border-radius: 50%;
      background: var(--pc);
      transition: transform 180ms var(--ease-out);
    }
    .swatch[aria-checked="true"] { box-shadow: inset 0 0 0 2.5px var(--pc); }
    .swatch[aria-checked="true"] span { transform: scale(0.74); }

    /* ============================================================
       Kalendarz
       ============================================================ */
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.5rem 0.35rem 1rem;
    }
    .cal-month { font-size: 1.06rem; font-weight: 600; }
    .cal-nav { display: flex; gap: 0.15rem; }
    .cal-nav button {
      width: 2.6rem;
      height: 2.6rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--accent-text);
    }
    .cal-nav button:active { background: var(--fill); }
    .cal-nav .ic { stroke-width: 2.4; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 0.25rem;
      padding: 0 0.5rem 0.6rem;
    }
    .cal-dow {
      padding: 0.2rem 0 0.35rem;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--label-2);
      text-transform: uppercase;
    }
    .cal-cell { position: relative; display: flex; justify-content: center; }
    .cal-cell.band { background: var(--pc-soft); }
    .cal-cell.band-start { border-top-left-radius: 999px; border-bottom-left-radius: 999px; }
    .cal-cell.band-end { border-top-right-radius: 999px; border-bottom-right-radius: 999px; }
    .cal-day {
      position: relative;
      width: min(2.6rem, 100%);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-variant-numeric: tabular-nums;
      transition: background-color 180ms ease, color 180ms ease;
    }
    .cal-day:active { transform: scale(0.92); }
    .cal-day.outside { color: var(--label-3); }
    .cal-day.is-today { color: var(--accent-text); font-weight: 700; }
    .cal-day.pick[aria-pressed="true"] { background: var(--label); color: var(--bg); font-weight: 600; }
    .cal-day.pick.is-today[aria-pressed="true"] { background: var(--accent); color: #FFFFFF; }
    .cal-day.sel { outline: 2px solid var(--label); outline-offset: 1px; }
    .cal-dots {
      position: absolute;
      bottom: 0.22rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 0.18rem;
    }
    .dot { display: inline-block; width: 0.3rem; height: 0.3rem; border-radius: 50%; background: var(--accent); }
    .dot.green { background: var(--green); }
    .cal-day.pick[aria-pressed="true"] .dot { background: currentColor; }

    .cal-day.lv-1 { background: var(--lvl-1); }
    .cal-day.lv-2 { background: var(--lvl-2); }
    .cal-day.lv-3 { background: var(--lvl-3); color: #FFFFFF; font-weight: 600; }

    .cal-day.st-done { background: var(--green); color: #FFFFFF; font-weight: 600; }
    .cal-day.st-missed { background: var(--red-soft); color: var(--red-text); }
    .cal-day.st-pending { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent-text); font-weight: 700; }
    .cal-day.st-off, .cal-day.st-future, .cal-day.st-before, .cal-day.st-paused { color: var(--label-3); }

    .cal-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1rem;
      padding: 0 1rem 0.9rem;
      font-size: 0.75rem;
      color: var(--label-2);
    }
    .cal-legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .legend-sw { width: 0.75rem; height: 0.75rem; border-radius: 50%; display: inline-block; }

    .cal-periods { border-top: 0.5px solid var(--separator); padding: 0.4rem 0 0.4rem; }
    .mini-title { padding: 0.4rem 1rem 0.2rem; font-size: 0.8rem; font-weight: 600; color: var(--label-2); }
    .mini-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-height: 2.6rem;
      padding: 0.3rem 1rem;
    }
    .mini-row:active { background: var(--fill); }
    .mini-name { flex: 1; min-width: 0; font-size: 0.94rem; }
    .mini-range { font-size: 0.8rem; color: var(--label-2); }

    /* Rok */
    .year { padding-bottom: 0.9rem; }
    .year-scroll {
      --cell: 0.78rem;
      overflow-x: auto;
      padding: 0.2rem 1rem 0.3rem;
      scrollbar-width: none;
    }
    .year-scroll::-webkit-scrollbar { display: none; }
    .year-months, .year-grid { gap: 0.2rem; }
    .year-months {
      display: grid;
      grid-template-columns: repeat(52, var(--cell));
      height: 1rem;
      margin-bottom: 0.25rem;
      font-size: 0.66rem;
      color: var(--label-2);
    }
    .year-months span { white-space: nowrap; overflow: visible; }
    .year-grid {
      display: grid;
      grid-template-rows: repeat(7, var(--cell));
      grid-auto-flow: column;
      grid-auto-columns: var(--cell);
    }
    .yc {
      display: inline-block;
      width: var(--cell, 0.78rem);
      height: var(--cell, 0.78rem);
      border-radius: 0.2rem;
      background: var(--lvl-0);
    }
    .yc.l1 { background: var(--lvl-1); }
    .yc.l2 { background: var(--lvl-2); }
    .yc.l3 { background: var(--lvl-3); }
    .yc.future { background: transparent; box-shadow: inset 0 0 0 1px var(--separator); }
    .yc.today { outline: 2px solid var(--accent); outline-offset: 1px; }
    .yc.sel { outline: 2px solid var(--label); outline-offset: 1px; }
    .year-foot {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.25rem;
      padding: 0.5rem 1rem 0;
      font-size: 0.75rem;
      color: var(--label-2);
    }
    .year-foot .yc { width: 0.7rem; height: 0.7rem; margin: 0 0.06rem; }

    /* Statystyki nawyku */
    .detail-meta { margin: -0.25rem 0.25rem 1rem; color: var(--label-2); font-size: 0.88rem; line-height: 1.4; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-bottom: 1rem; }
    .stat { padding: 0.8rem 0.9rem; border-radius: 1rem; background: var(--surface); }
    .stat-label { font-size: 0.75rem; font-weight: 500; color: var(--label-2); }
    .stat-value {
      margin-top: 0.1rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      font-variant-numeric: tabular-nums;
    }
    .stat-sub { font-size: 0.72rem; color: var(--label-2); }
    .day-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      border-top: 0.5px solid var(--separator);
    }
    .dp-date { font-weight: 600; }
    .dp-status { margin-top: 0.1rem; font-size: 0.85rem; color: var(--label-2); }

    /* Planer */
    .plan-group + .plan-group { border-top: 0.5px solid var(--separator); }
    .plan-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0.5rem 0 1rem;
    }
    .plan-head h3 { font-size: 0.8rem; font-weight: 600; color: var(--label-2); }
    .plan-group .list > li:first-child::before { display: none; }
    .plan-empty { padding: 0.9rem 1rem 0.2rem; color: var(--label-2); font-size: 0.94rem; }
    .time-tag {
      flex-shrink: 0;
      min-width: 2.9rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-text);
      font-variant-numeric: tabular-nums;
    }
    .reorder { display: flex; flex-shrink: 0; margin-right: -0.5rem; }

    /* Ustawienia */
    .row .seg { flex: 0 0 auto; }
    .row .seg button { min-width: 3.1rem; }
    .settings-seg { padding: 0.65rem 1rem; }
    .app-foot { padding: 0.25rem 0 1rem; text-align: center; font-size: 0.75rem; color: var(--label-2); }

    /* ============================================================
       Dolny pasek kart (pływająca kapsuła)
       ============================================================ */
    .tabbar {
      position: fixed;
      z-index: 60;
      left: 0;
      right: 0;
      bottom: max(0.75rem, calc(var(--safe-bottom) - 0.4rem));
      display: flex;
      justify-content: center;
      padding: 0 1rem;
      pointer-events: none;
    }
    .tabbar-inner {
      pointer-events: auto;
      width: 100%;
      max-width: 26rem;
      height: var(--tabbar-h);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.15rem;
      padding: 0.3rem;
      border-radius: 999px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      box-shadow: var(--shadow-float), inset 0 0 0 0.5px var(--glass-edge);
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.12rem;
      border-radius: 999px;
      font-size: 0.62rem;
      font-weight: 600;
      transition: transform 160ms var(--ease-out), background-color 200ms ease, color 200ms ease;
    }
    .tab .ic { width: 1.45rem; height: 1.45rem; }
    .tab[aria-current="page"] { color: var(--accent-text); background: var(--fill); }
    .tab:active { transform: scale(0.93); }

    /* ============================================================
       Arkusze (sheets)
       ============================================================ */
    .sheet-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .scrim {
      position: absolute;
      inset: 0;
      background: var(--scrim);
      animation: fade-in 320ms ease backwards;
    }
    .sheet {
      position: relative;
      width: 100%;
      max-width: var(--content-w);
      max-height: calc(100dvh - var(--safe-top) - 0.75rem);
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-radius: 1.6rem 1.6rem 0 0;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.18);
      animation: sheet-in 480ms var(--ease-drawer) backwards;
    }
    .closing .scrim { animation: fade-out 260ms ease forwards; }
    .closing .sheet { animation: sheet-out 280ms var(--ease-drawer) forwards; }
    .sheet-head {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.5rem;
      padding: 1.15rem 1rem 0.65rem;
      touch-action: none;
    }
    .grabber {
      position: absolute;
      top: 0.4rem;
      left: 50%;
      width: 2.3rem;
      height: 0.3rem;
      margin-left: -1.15rem;
      border-radius: 999px;
      background: var(--fill-strong);
    }
    .sheet-title {
      max-width: 13rem;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sheet-btn {
      justify-self: start;
      min-height: 2.5rem;
      padding: 0 0.95rem;
      border-radius: 999px;
      background: var(--fill);
      font-size: 0.94rem;
      font-weight: 500;
      transition: transform 160ms var(--ease-out);
    }
    .sheet-btn:active { transform: scale(0.95); }
    .sheet-btn.primary { justify-self: end; background: var(--accent); color: #FFFFFF; font-weight: 600; }
    .sheet-body {
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 0.5rem 1rem calc(1.5rem + var(--safe-bottom));
    }
    .sheet-body .card, .sheet-body .stats { margin-bottom: 1.25rem; }
    .sheet-sub { margin: -0.25rem 0.25rem 1rem; font-size: 0.88rem; color: var(--label-2); }

    .alert-sheet .sheet-body { padding-top: 1.75rem; text-align: center; }
    .alert-sheet h2 { font-size: 1.18rem; font-weight: 700; }
    .alert-sheet p { max-width: 22rem; margin: 0.5rem auto 1.5rem; color: var(--label-2); line-height: 1.4; }
    .alert-actions { display: flex; flex-direction: column; gap: 0.6rem; }

    @media (min-width: 44rem) {
      .sheet-layer { align-items: center; padding: 1.5rem; }
      .sheet {
        max-height: min(85dvh, 48rem);
        border-radius: 1.6rem;
        animation-name: dialog-in;
        animation-duration: 260ms;
        animation-timing-function: var(--ease-out);
      }
      .closing .sheet { animation: dialog-out 180ms ease forwards; }
      .grabber { display: none; }
      .sheet-body { padding-bottom: 1.5rem; }
    }

    @keyframes fade-in { from { opacity: 0; } }
    @keyframes fade-out { to { opacity: 0; } }
    @keyframes sheet-in { from { transform: translateY(100%); } }
    @keyframes sheet-out { from { transform: translateY(0); } to { transform: translateY(100%); } }
    @keyframes dialog-in { from { opacity: 0; transform: scale(0.96); } }
    @keyframes dialog-out { to { opacity: 0; transform: scale(0.97); } }

    /* Menu */
    .menu-layer { position: fixed; inset: 0; z-index: 90; }
    .menu-dismiss { position: absolute; inset: 0; }
    .menu {
      position: absolute;
      top: calc(var(--safe-top) + 3.35rem);
      right: max(1rem, calc((100vw - var(--content-w)) / 2 + 0.75rem));
      min-width: 13rem;
      overflow: hidden;
      border-radius: 1rem;
      background: var(--glass);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      backdrop-filter: blur(30px) saturate(180%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18), inset 0 0 0 0.5px var(--glass-edge);
      transform-origin: top right;
      animation: menu-in 220ms var(--ease-out) backwards;
    }
    .menu button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.8rem 1rem;
    }
    .menu button + button { border-top: 0.5px solid var(--separator); }
    .menu button:active { background: var(--fill); }
    @keyframes menu-in { from { opacity: 0; transform: scale(0.9); } }

    /* Toast */
    .toast {
      position: fixed;
      z-index: 150;
      left: 50%;
      bottom: calc(var(--tabbar-h) + max(0.75rem, calc(var(--safe-bottom) - 0.4rem)) + 0.9rem);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.9rem;
      width: max-content;
      max-width: min(26rem, calc(100vw - 2rem));
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      background: var(--toast-bg);
      color: #FFFFFF;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: var(--shadow-float);
      animation: toast-in 320ms var(--ease-out) backwards;
    }
    .toast.has-action { padding-right: 0.45rem; }
    .toast.closing { animation: toast-out 200ms ease forwards; }
    .toast-action {
      flex-shrink: 0;
      min-height: 2.1rem;
      padding: 0 0.85rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: #70B7FF;
      font-weight: 600;
    }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 0.75rem); } }
    @keyframes toast-out { to { opacity: 0; transform: translate(-50%, 0.4rem); } }

    /* ============================================================
       Preferencje systemowe
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      .sheet, .menu { animation: fade-in 200ms ease backwards; }
      .closing .sheet { animation: fade-out 160ms ease forwards; }
      .toast { animation: fade-in 200ms ease backwards; }
      .toast.closing { animation: fade-out 160ms ease forwards; }
      .seg-thumb, .switch::after, .ring-value, .topbar-title { transition: none; }
      .check .ic { transform: none; }
      .check:active .check-ring, .btn:active, .nav-btn:active, .tab:active, .chip:active,
      .day-chip:active, .strip:active, .sheet-btn:active, .cal-day:active { transform: none; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .topbar::before, .tabbar-inner, .nav-btn, .menu {
        background: var(--surface);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }
    @media (prefers-contrast: more) {
      :root { --separator: rgba(60, 60, 67, 0.45); --label-2: #3A3A3C; }
      .card, .stat { box-shadow: inset 0 0 0 1px var(--separator); }
    }
  
    /* ============================================================
       Konsumpcja — dodatki do wspólnego systemu (tokeny Rutyny 1.0.1)
       ============================================================ */
    :root {
      --orange: #FF9500;
      --orange-text: #A35200;
      --planned: rgba(0, 122, 255, 0.32);
    }
    html[data-theme="dark"] {
      --orange: #FF9F0A;
      --orange-text: #FFB340;
      --planned: rgba(10, 132, 255, 0.42);
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --orange: #FF9F0A;
        --orange-text: #FFB340;
        --planned: rgba(10, 132, 255, 0.42);
      }
    }

    .muted { color: var(--label-2); }
    .muted-note { color: var(--label-2); font-size: 0.94rem; line-height: 1.4; }
    .muted-note.center { padding: 1.5rem 1rem; text-align: center; }
    .text-btn { color: var(--accent-text); font-weight: 500; padding: 0.4rem 0.25rem; margin: -0.4rem -0.25rem; font-size: 0.88rem; }
    .toast span { min-width: 0; }

    /* Podgląd budżetu na liście */
    .peek {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 0.95rem 1.1rem 0.9rem;
      margin-bottom: 1.25rem;
      text-align: left;
      transition: transform 160ms var(--ease-out), background-color 200ms ease;
    }
    .peek:active { transform: scale(0.985); }
    .peek-top { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
    .peek-month { font-weight: 600; }
    .peek-amount, .b-amount { font-size: 1.32rem; font-weight: 700; letter-spacing: -0.015em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .peek-amount .of, .b-amount .of { font-size: 0.9rem; font-weight: 500; color: var(--label-2); letter-spacing: 0; }
    .peek-foot { display: flex; justify-content: space-between; gap: 0.75rem; font-size: 0.8rem; color: var(--label-2); font-variant-numeric: tabular-nums; }
    .peek-foot .over, .b-left.over { color: var(--red-text); font-weight: 600; }

    .meter2 {
      display: flex;
      height: 0.5rem;
      border-radius: 999px;
      background: var(--fill);
      overflow: hidden;
    }
    .meter2 span { display: block; height: 100%; transition: width 500ms var(--ease-out); }
    .meter2 .m-spent { background: var(--accent); }
    .meter2 .m-planned { background: var(--planned); }
    .meter2.over .m-spent { background: var(--red); }
    .meter2.over .m-planned { background: var(--red-soft); }

    /* Segmenty z licznikiem */
    .seg-n { margin-left: 0.35rem; color: var(--label-2); font-weight: 500; font-variant-numeric: tabular-nums; }
    .seg-n:empty { display: none; }

    /* Filtry kategorii */
    .chip-scroll { display: flex; gap: 0.4rem; overflow-x: auto; margin: -0.25rem -1rem 1.25rem; padding: 0 1rem; scrollbar-width: none; }
    .chip-scroll::-webkit-scrollbar { display: none; }
    .chip-scroll .chip { flex-shrink: 0; }
    .chip[aria-pressed="true"] { background: var(--label); color: var(--bg); }
    .chips.wrap { margin: 0.25rem 0 0; }
    .chips.wrap .chip { background: var(--surface); }
    .chips.wrap .chip[aria-pressed="true"] { background: var(--accent); color: #FFFFFF; }

    /* Wiersze pozycji */
    .price {
      flex-shrink: 0;
      max-width: 48%;
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .price.none, .price.muted { color: var(--label-2); }
    .price.none { font-size: 0.88rem; }
    .item-row .row-main { align-items: flex-start; }
    .item-row .row-main .price { padding-top: 0.05rem; }
    .meta-warn { color: var(--orange-text); font-weight: 600; }
    .meta-wait { color: var(--orange-text); }
    .meta-nec { color: var(--accent-text); }
    .sheet-head > :last-child { justify-self: end; }

    .list-label { padding: 0.9rem 1rem 0.35rem; font-size: 0.8rem; font-weight: 600; color: var(--label-2); }
    .list-label.out { padding: 0 1rem 0.4rem; font-weight: 400; }

    /* Budżet */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin: -0.25rem -0.25rem 1rem;
    }
    .month-title { flex: 1; min-width: 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 0.1rem; }
    .month-title h2 { font-size: 1.18rem; font-weight: 700; letter-spacing: -0.01em; }
    .month-title span { font-size: 0.8rem; color: var(--label-2); }
    .month-title .text-btn { margin: -0.4rem -0.25rem -0.4rem; font-size: 0.8rem; }

    .budget { margin-bottom: 1.75rem; }
    .b-block { display: flex; flex-direction: column; gap: 0.55rem; padding: 0.95rem 1.1rem; }
    .b-block + .b-block { border-top: 0.5px solid var(--separator); }
    .b-top { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
    .b-label { font-weight: 600; }
    .b-amount.sm { font-size: 1.05rem; }
    .b-legend { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; font-size: 0.8rem; color: var(--label-2); font-variant-numeric: tabular-nums; }
    .b-legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
    .lg { width: 0.55rem; height: 0.55rem; border-radius: 50%; }
    .lg.spent { background: var(--accent); }
    .lg.planned { background: var(--planned); }
    .b-left { font-size: 0.88rem; color: var(--label-2); font-variant-numeric: tabular-nums; }
    .section-sum { color: var(--label-2); font-size: 0.94rem; font-variant-numeric: tabular-nums; }

    /* Pola */
    .input-inline {
      flex-shrink: 0;
      width: 6.5rem;
      min-height: 2.25rem;
      padding: 0.35rem 0.6rem;
      border: 0;
      border-radius: 0.55rem;
      background: var(--fill);
      color: var(--label);
      text-align: right;
      font-variant-numeric: tabular-nums;
      -webkit-appearance: none;
      appearance: none;
    }
    .input-inline.sm { width: 5.1rem; }
    .input-inline::placeholder { color: var(--label-3); }
    .input-inline:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .money-input { display: inline-flex; align-items: center; gap: 0.4rem; flex-shrink: 0; color: var(--label-2); }
    .price-range { display: inline-flex; align-items: center; gap: 0.3rem; flex-shrink: 0; }
    .price-range .dash { color: var(--label-3); }
    .input-name { font-size: 1.06rem; font-weight: 500; }
    .stepper { display: inline-flex; align-items: center; gap: 0.1rem; flex-shrink: 0; padding: 0.15rem; border-radius: 0.6rem; background: var(--fill); }
    .stepper button { width: 2.25rem; height: 2.05rem; display: grid; place-items: center; border-radius: 0.5rem; font-size: 1.15rem; font-weight: 600; }
    .stepper button:active { background: var(--fill-strong); }
    .stepper button:disabled { color: var(--label-3); }
    .stepper output { min-width: 2.2rem; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

    .pick-check {
      width: 1.5rem;
      height: 1.5rem;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid var(--label-3);
      transition: background-color 160ms ease, border-color 160ms ease;
    }
    .pick-check .ic { width: 0.85rem; height: 0.85rem; color: #FFFFFF; stroke-width: 3; opacity: 0; transition: opacity 120ms ease; }
    [aria-pressed="true"] > .pick-check { background: var(--accent); border-color: var(--accent); }
    [aria-pressed="true"] > .pick-check .ic { opacity: 1; }

    /* Szczegóły pozycji */
    .detail { padding: 0.25rem 0.25rem 1.1rem; }
    .detail-name { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.018em; line-height: 1.2; overflow-wrap: anywhere; }
    .detail-price { margin-top: 0.35rem; font-size: 1.18rem; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 0.5rem; }
    .detail-tag { font-size: 0.8rem; font-weight: 500; color: var(--label-2); }
    .detail-status { margin-top: 0.2rem; font-size: 0.88rem; color: var(--label-2); }
    .detail-cta { margin-bottom: 1.25rem; min-height: 3.1rem; font-size: 1.02rem; }
    .detail-foot { padding: 0 1rem 0.5rem; font-size: 0.8rem; color: var(--label-2); text-align: center; }
    .sheet-body .sheet-note { margin: -0.75rem 0 1.25rem; }
    .note-block { padding: 0.75rem 1rem; }
    .note-block + .note-block { border-top: 0.5px solid var(--separator); }
    .note-block p { margin-top: 0.2rem; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-wrap; }
    a.row-main { color: inherit; text-decoration: none; }
    .row > .icon-btn.sm { margin-right: -0.5rem; color: var(--accent-text); }

    /* Edycja opcji */
    .sheet-body .card.opt-edit { margin-bottom: 0.75rem; }
    .opt-head { display: flex; align-items: center; justify-content: space-between; padding: 0.35rem 0.5rem 0 1rem; }
    .opt-pick { display: inline-flex; align-items: center; gap: 0.55rem; min-height: 2.5rem; font-size: 0.88rem; font-weight: 500; color: var(--label-2); }
    .opt-pick[aria-pressed="true"] { color: var(--accent-text); }
    .opt-main { display: flex; align-items: center; gap: 0.6rem; }
    .opt-main .input { flex: 1; min-width: 0; }
    .opt-edit + .card:not(.opt-edit), .opt-edit + ul.card { margin-top: 0; }

    @media (prefers-reduced-motion: reduce) {
      .peek:active { transform: none; }
      .meter2 span { transition: none; }
    }

    /* Trzy zakładki zamiast czterech z Rutyny */
    .tabbar-inner { grid-template-columns: repeat(3, 1fr); max-width: 21rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <input type="file" id="backup-input" accept="application/json,.json" hidden />
  <noscript>Konsumpcja potrzebuje włączonej obsługi JavaScriptu.</noscript>
  <script>
  (function () {
    'use strict';

    const APP_VERSION = '1.0.1';
    const MODEL_VERSION = 2;

    /* ============================================================
       Daty
       ============================================================ */
    const pad = (n) => String(n).padStart(2, '0');
    const toDateStr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    function parseDate(s) {
      const [y, m, d] = String(s).split('-').map(Number);
      return new Date(y || 1970, (m || 1) - 1, d || 1, 12, 0, 0, 0);
    }
    const isMonth = (m) => typeof m === 'string' && /^\d{4}-\d{2}$/.test(m);
    const isDate = (d) => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d);
    function addMonths(m, n) {
      const [y, mo] = m.split('-').map(Number);
      const t = y * 12 + (mo - 1) + n;
      return `${Math.floor(t / 12)}-${pad((t % 12) + 1)}`;
    }
    function monthDiff(a, b) {
      const [ay, am] = a.split('-').map(Number);
      const [by, bm] = b.split('-').map(Number);
      return by * 12 + bm - (ay * 12 + am);
    }
    const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
    const curMonth = () => state.today.slice(0, 7);

    const fmtMonth = new Intl.DateTimeFormat('pl-PL', { month: 'long' });
    const fmtDayMonth = new Intl.DateTimeFormat('pl-PL', { day: 'numeric', month: 'long' });
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const monthName = (m) => fmtMonth.format(parseDate(`${m}-01`));
    /* „grudzień”, a dla innego roku „styczeń 2027” */
    const monthLabel = (m) => `${monthName(m)}${m.slice(0, 4) !== state.today.slice(0, 4) ? ` ${m.slice(0, 4)}` : ''}`;
    /* dopełniacz: „od października” */
    const monthGen = (m) => fmtDayMonth.format(parseDate(`${m}-01`)).replace(/^\d+\s*/, '');
    const dateLabel = (d) => `${fmtDayMonth.format(parseDate(d))}${d.slice(0, 4) !== state.today.slice(0, 4) ? ` ${d.slice(0, 4)}` : ''}`;

    /* ============================================================
       Liczby i tekst
       ============================================================ */
    function plural(n, one, few, many) {
      const a = Math.abs(n);
      if (a === 1) return one;
      const t = a % 10;
      const h = a % 100;
      if (t >= 2 && t <= 4 && (h < 12 || h > 14)) return few;
      return many;
    }
    const pl = (n, one, few, many) => `${n} ${plural(n, one, few, many)}`;
    function esc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    function generateId(prefix) {
      if (window.crypto && typeof crypto.randomUUID === 'function') return `${prefix}_${crypto.randomUUID()}`;
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
    }
    function parseNum(v) {
      const s = String(v ?? '').trim().replace(/\s/g, '').replace(/zł$/i, '').replace(',', '.');
      if (s === '' || s === '.') return null;
      const n = Number(s);
      return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
    }
    const num = (v) => {
      const n = Number(v);
      return Number.isFinite(n) && n > 0 ? n : 0;
    };
    const inputNum = (n) => (num(n) ? String(Math.round(Number(n) * 100) / 100).replace('.', ',') : '');
    function fmtAmt(n) {
      const v = Math.round((Number(n) || 0) * 100) / 100;
      const [int, dec] = Math.abs(v).toFixed(2).split('.');
      const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      return `${v < 0 ? '−' : ''}${dec === '00' ? grouped : `${grouped},${dec}`}`;
    }
    const fmtMoney = (n) => `${fmtAmt(n)} zł`;
    function safeUrl(u) {
      const s = String(u || '').trim();
      if (!s) return '';
      if (/^https?:\/\//i.test(s)) return s;
      if (/^[\w-]+(\.[\w-]+)+/.test(s)) return `https://${s}`;
      return '';
    }
    function hostOf(u) {
      try {
        return new URL(u).hostname.replace(/^www\./, '');
      } catch {
        return '';
      }
    }

    /* ============================================================
       Ikony
       ============================================================ */
    const ICONS = {
      check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      chevR: '<path d="M9.5 6l6 6-6 6"/>',
      chevL: '<path d="M14.5 6l-6 6 6 6"/>',
      close: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
      external: '<path d="M14 4.5h5.5V10"/><path d="M19.5 4.5L11 13"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>',
      tabList: '<path d="M5.5 8.5h13l-1 11.5h-11z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/>',
      tabBudget: '<path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12z"/><path d="M15 3.95A8.5 8.5 0 0 1 20.05 9H15z"/>',
      tabSettings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'
    };
    const icon = (name, cls = '') =>
      `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONS[name]}</svg>`;

    /* ============================================================
       Słowniki
       ============================================================ */
    const STAGES = {
      lista: 'Na liście',
      kupuje: 'Kupuję',
      kupione: 'Kupione',
      rezygnacja: 'Rezygnacja'
    };
    const ACTIVE = ['lista', 'kupuje'];
    const DEFAULT_CATEGORIES = [
      'Sprzęt i elektronika',
      'Garderoba i dodatki',
      'Dom i wyposażenie',
      'Samochód i transport',
      'Zdrowie i sport',
      'Edukacja i książki',
      'Usługi i serwis',
      'Inne'
    ];
    const RESIGN_REASONS = ['Zmiana planów', 'Za drogo', 'Znalazłem coś lepszego', 'Już niepotrzebne'];

    /* ============================================================
       IndexedDB (konsumpcja_db_v1 — dane z poprzedniej wersji zostają)
       ============================================================ */
    const DB_NAME = 'konsumpcja_db_v1';
    const DB_VERSION = 1;
    const STORES = ['items', 'categories', 'settings'];
    const DEFAULT_SETTINGS = {
      id: 'user_settings',
      theme: 'system',
      monthlyLimit: 1500,
      enableCoolingHighlight: true,
      coolingDaysHighlight: 14,
      modelVersion: MODEL_VERSION
    };

    let dbPromise = null;
    function openDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('Ta przeglądarka nie zapisuje danych lokalnie.'));
          return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          STORES.forEach((s) => {
            if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });
          });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => {
          dbPromise = null;
          reject(req.error);
        };
      });
      return dbPromise;
    }
    function dbTx(stores, fn) {
      return openDB().then(
        (db) =>
          new Promise((resolve, reject) => {
            const t = db.transaction(stores, 'readwrite');
            fn(t);
            t.oncomplete = () => resolve();
            t.onerror = () => reject(t.error);
            t.onabort = () => reject(t.error);
          })
      );
    }
    function dbGetAll(store) {
      return openDB().then(
        (db) =>
          new Promise((resolve, reject) => {
            if (!db.objectStoreNames.contains(store)) {
              resolve([]);
              return;
            }
            const req = db.transaction(store, 'readonly').objectStore(store).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error);
          })
      );
    }
    const dbPut = (store, rec) => dbTx([store], (t) => t.objectStore(store).put(rec));
    const dbPutMany = (store, list) =>
      list.length ? dbTx([store], (t) => list.forEach((r) => t.objectStore(store).put(r))) : Promise.resolve();
    const dbDelete = (store, key) => dbTx([store], (t) => t.objectStore(store).delete(key));
    function persist(p) {
      p.catch(() => toast('Nie udało się zapisać zmian na urządzeniu.'));
      return p;
    }

    /* ============================================================
       Stan
       ============================================================ */
    const state = {
      ready: false,
      error: null,
      today: toDateStr(),
      tab: 'list',
      seg: 'lista',
      cat: '',
      month: toDateStr().slice(0, 7),
      items: [],
      categories: [],
      settings: { ...DEFAULT_SETTINGS },
      sheet: null,
      toast: null,
      scroll: {}
    };
    const findItem = (id) => state.items.find((x) => x.id === id) || null;
    const limit = () => Math.max(0, Number(state.settings.monthlyLimit) || 0);

    /* ============================================================
       Przejście ze starego modelu (Chcę/Rozważam/…, typy, priorytety)
       ============================================================ */
    const OLD_STAGES = {
      chce: 'lista',
      rozwazam: 'lista',
      postponed: 'lista',
      kupuje: 'kupuje',
      done: 'kupione',
      resigned: 'rezygnacja',
      changed: 'rezygnacja'
    };
    function migrateItem(raw, cur) {
      const it = { ...raw };
      let changed = false;
      if (!STAGES[it.stage]) {
        const old = it.stage;
        it.stage = OLD_STAGES[old] || 'lista';
        changed = true;
        /* Stary zapis dawał każdej pozycji bieżący miesiąc. Na liście zostaje tylko termin z przyszłości. */
        if (it.stage === 'lista' && old !== 'postponed' && !(isMonth(it.plannedMonth) && it.plannedMonth >= cur)) it.plannedMonth = '';
        if (it.stage === 'rezygnacja' && !isDate(it.resolvedAt)) it.resolvedAt = toDateStr(new Date(Number(it.updatedAt) || Date.now()));
        if (it.stage === 'kupione' && !isDate(it.completedAt)) it.completedAt = toDateStr(new Date(Number(it.updatedAt) || Date.now()));
      }
      if (typeof it.necessary !== 'boolean') {
        it.necessary = it.itemKind === 'konieczne' || it.priority === 'critical';
        changed = true;
      }
      if ('itemKind' in it || 'priority' in it) {
        delete it.itemKind;
        delete it.priority;
        changed = true;
      }
      if (typeof it.name !== 'string') it.name = String(it.name || 'Bez nazwy');
      if (typeof it.category !== 'string') it.category = '';
      if (!isMonth(it.plannedMonth)) it.plannedMonth = '';
      if (!isDate(it.createdAt)) it.createdAt = toDateStr(new Date(Number(it.updatedAt) || Date.now()));
      if (!Array.isArray(it.variants)) it.variants = [];
      const inst = it.installments || {};
      if (!it.installments || typeof inst.enabled !== 'boolean' || 'monthlyAmount' in inst || 'zeroPercent' in inst || 'startMonth' in inst) {
        it.installments = { enabled: Boolean(inst.enabled), count: Math.max(2, parseInt(inst.count, 10) || 3) };
        changed = true;
      }
      return { it, changed };
    }

    /* ============================================================
       Ceny, terminy, budżet
       ============================================================ */
    const selectedOption = (it) => (it.variants || []).find((v) => v.selected && num(v.price)) || null;
    function priceRange(it) {
      const sv = selectedOption(it);
      if (sv) return { min: num(sv.price), max: num(sv.price), from: 'option' };
      if (it.priceMode === 'range') {
        const a = num(it.priceMin);
        const b = num(it.priceMax);
        if (a && b) return { min: Math.min(a, b), max: Math.max(a, b) };
        if (a) return { min: a, max: a, open: 'from' };
        if (b) return { min: b, max: b, open: 'to' };
      }
      if (num(it.price)) return { min: num(it.price), max: num(it.price) };
      const ps = (it.variants || []).map((v) => num(v.price)).filter(Boolean);
      if (ps.length) return { min: Math.min(...ps), max: Math.max(...ps), from: 'options' };
      return null;
    }
    const paid = (it) => (it.stage === 'kupione' && num(it.finalPrice) ? num(it.finalPrice) : 0);
    function itemCost(it) {
      if (paid(it)) return paid(it);
      const r = priceRange(it);
      return r ? Math.round(((r.min + r.max) / 2) * 100) / 100 : 0;
    }
    function isEstimate(it) {
      if (paid(it)) return false;
      const r = priceRange(it);
      return Boolean(r && (r.min !== r.max || r.open));
    }
    function priceLabel(it) {
      if (paid(it)) return fmtMoney(paid(it));
      const r = priceRange(it);
      if (!r) return '';
      if (r.open === 'from') return `od ${fmtMoney(r.min)}`;
      if (r.open === 'to') return `do ${fmtMoney(r.max)}`;
      if (r.min === r.max) return fmtMoney(r.min);
      return `${fmtAmt(r.min)}–${fmtMoney(r.max)}`;
    }
    const approx = (it, amount) => `${isEstimate(it) ? 'ok. ' : ''}${fmtMoney(amount)}`;
    const instOf = (it) => (it.installments && it.installments.enabled ? { count: Math.max(2, parseInt(it.installments.count, 10) || 3) } : null);

    /* Miesiąc, w którym pozycja obciąża budżet (lub od którego liczą się raty). */
    function effMonth(it) {
      const cur = curMonth();
      if (it.stage === 'kupione') return isDate(it.completedAt) ? it.completedAt.slice(0, 7) : cur;
      if (it.stage === 'kupuje') return isMonth(it.plannedMonth) && it.plannedMonth > cur ? it.plannedMonth : cur;
      if (it.stage === 'rezygnacja') return isDate(it.resolvedAt) ? it.resolvedAt.slice(0, 7) : '';
      return it.plannedMonth || '';
    }
    const isOverdue = (it) => it.stage === 'kupuje' && isMonth(it.plannedMonth) && it.plannedMonth < curMonth();
    function impact(it, m) {
      if (it.stage !== 'kupione' && it.stage !== 'kupuje') return null;
      const cost = itemCost(it);
      const start = effMonth(it);
      const inst = instOf(it);
      if (inst) {
        const d = monthDiff(start, m);
        return d >= 0 && d < inst.count ? { amount: Math.round((cost / inst.count) * 100) / 100, index: d + 1, count: inst.count } : null;
      }
      return start === m ? { amount: cost } : null;
    }
    function monthSummary(m) {
      const s = {
        pleasure: { spent: 0, planned: 0 },
        necessary: { spent: 0, planned: 0 },
        bought: [],
        planned: [],
        listed: [],
        resigned: [],
        resignedSum: 0
      };
      for (const it of state.items) {
        if (it.stage === 'lista') {
          if (it.plannedMonth === m) s.listed.push(it);
          continue;
        }
        if (it.stage === 'rezygnacja') {
          if (effMonth(it) === m) {
            s.resigned.push(it);
            s.resignedSum += itemCost(it);
          }
          continue;
        }
        const imp = impact(it, m);
        if (!imp) continue;
        const bucket = it.necessary ? s.necessary : s.pleasure;
        if (it.stage === 'kupione') {
          bucket.spent += imp.amount;
          s.bought.push({ it, imp });
        } else {
          bucket.planned += imp.amount;
          s.planned.push({ it, imp });
        }
      }
      s.bought.sort((a, b) => (b.it.completedAt || '').localeCompare(a.it.completedAt || ''));
      s.planned.sort((a, b) => a.it.name.localeCompare(b.it.name, 'pl'));
      s.listed.sort((a, b) => a.name.localeCompare(b.name, 'pl'));
      s.resigned.sort((a, b) => (b.resolvedAt || '').localeCompare(a.resolvedAt || ''));
      return s;
    }
    function monthOptions(from, withNone) {
      const cur = curMonth();
      const opts = withNone ? [['', 'Bez terminu']] : [];
      for (let i = 0; i < 13; i++) {
        const m = addMonths(cur, i);
        opts.push([m, i === 0 ? 'Ten miesiąc' : cap(monthLabel(m))]);
      }
      if (from && from > addMonths(cur, 12)) opts.push([from, cap(monthLabel(from))]);
      return opts;
    }

    /* ============================================================
       Motyw
       ============================================================ */
    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme() {
      const t = state.settings.theme;
      const root = document.documentElement;
      if (t === 'light' || t === 'dark') root.dataset.theme = t;
      else delete root.dataset.theme;
      const dark = t === 'dark' || (t !== 'light' && darkQuery.matches);
      document.getElementById('meta-theme').setAttribute('content', dark ? '#000000' : '#F2F2F7');
    }
    darkQuery.addEventListener('change', () => {
      if (state.settings.theme === 'system') applyTheme();
    });

    /* ============================================================
       Morfowanie DOM (jak w Rutynie 1.0.1)
       ============================================================ */
    const keyOf = (n) => (n.nodeType === 1 ? n.getAttribute('data-key') : null);
    function patchChildren(parent, next) {
      const incoming = Array.from(next.childNodes);
      const keyed = new Map();
      for (const o of Array.from(parent.childNodes)) {
        const k = keyOf(o);
        if (k) keyed.set(k, o);
      }
      let i = 0;
      for (const n of incoming) {
        const cur = parent.childNodes[i] || null;
        const k = keyOf(n);
        if (k) {
          const match = keyed.get(k);
          if (match && match.nodeName === n.nodeName) {
            if (match !== cur) parent.insertBefore(match, cur);
            keyed.delete(k);
            patchNode(match, n);
            i++;
            continue;
          }
        } else if (cur && !keyOf(cur) && cur.nodeType === n.nodeType && cur.nodeName === n.nodeName) {
          patchNode(cur, n);
          i++;
          continue;
        } else if (cur && n.nodeType === 1) {
          const cls = n.getAttribute('class');
          let probe = cur.nextSibling;
          for (let step = 0; probe && step < 8; step++) {
            if (probe.nodeType === 1 && !keyOf(probe) && probe.nodeName === n.nodeName && probe.getAttribute('class') === cls) break;
            probe = probe.nextSibling;
          }
          if (probe && probe.nodeType === 1 && probe.nodeName === n.nodeName && probe.getAttribute('class') === cls) {
            let x = cur;
            while (x !== probe) {
              const nx = x.nextSibling;
              parent.removeChild(x);
              x = nx;
            }
            patchNode(probe, n);
            i++;
            continue;
          }
        }
        parent.insertBefore(n, cur);
        i++;
      }
      while (parent.childNodes.length > i) parent.removeChild(parent.lastChild);
    }
    function patchNode(a, b) {
      if (a.nodeType !== 1) {
        if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
        return;
      }
      const keepStyle = a.hasAttribute('data-keep-style');
      for (const attr of Array.from(a.attributes)) {
        if (keepStyle && attr.name === 'style') continue;
        if (!b.hasAttribute(attr.name)) a.removeAttribute(attr.name);
      }
      for (const attr of Array.from(b.attributes)) {
        if (keepStyle && attr.name === 'style') continue;
        if (a.getAttribute(attr.name) !== attr.value) a.setAttribute(attr.name, attr.value);
      }
      const tag = a.nodeName;
      if (tag === 'INPUT') {
        const v = b.getAttribute('value') ?? '';
        if (document.activeElement !== a && a.value !== v) a.value = v;
        return;
      }
      if (tag === 'TEXTAREA') {
        if (document.activeElement !== a && a.value !== b.textContent) a.value = b.textContent;
        return;
      }
      patchChildren(a, b);
      if (tag === 'SELECT') {
        const sel = b.querySelector('option[selected]');
        const v = sel ? sel.getAttribute('value') : '';
        if (document.activeElement !== a && a.value !== v) a.value = v;
      }
    }
    function morph(root, html) {
      const tpl = document.createElement('template');
      tpl.innerHTML = html;
      patchChildren(root, tpl.content);
    }

    /* ============================================================
       Wspólne elementy UI
       ============================================================ */
    const appRoot = document.getElementById('app');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    const navIcon = (action, ic, label) =>
      `<button type="button" class="nav-btn icon" data-action="${action}" aria-label="${label}">${icon(ic)}</button>`;
    function segmented(opts, value, action, label) {
      const i = Math.max(0, opts.findIndex((o) => String(o[0]) === String(value)));
      return `<div class="seg" role="group" aria-label="${esc(label)}" style="--n:${opts.length};--i:${i}">
        <span class="seg-thumb" aria-hidden="true"></span>
        ${opts
          .map(
            ([v, l]) =>
              `<button type="button" data-action="${action}" data-value="${v}" aria-pressed="${String(v) === String(value)}">${l}</button>`
          )
          .join('')}
      </div>`;
    }
    function switchRow(title, sub, checked, action, key, attrs = '') {
      return `<li class="row">
        <span class="row-text" id="sw-${key}"><span class="row-title">${title}</span>${sub ? `<span class="row-meta">${sub}</span>` : ''}</span>
        <button type="button" class="switch" role="switch" aria-checked="${Boolean(checked)}" aria-labelledby="sw-${key}" data-action="${action}" data-key="${key}" ${attrs}></button>
      </li>`;
    }
    function navRow(title, action, { sub = '', value = '', attrs = '', key = '', tone = '' } = {}) {
      return `<li ${key ? `data-key="${key}"` : ''}><div class="row">
        <button type="button" class="row-main" data-action="${action}" ${attrs}>
          <span class="row-text"><span class="row-title ${tone}">${title}</span>${sub ? `<span class="row-meta">${sub}</span>` : ''}</span>
          ${value ? `<span class="row-value">${value}</span>` : ''}
          ${tone ? '' : icon('chevR', 'chev')}
        </button>
      </div></li>`;
    }
    const actionRow = (title, action, opts = {}) => navRow(title, action, { tone: opts.tone || 'accent', ...opts });
    function stepper(value, action, key, label, min, max) {
      return `<span class="stepper" role="group" aria-label="${esc(label)}">
        <button type="button" data-action="${action}" data-key="${key}" data-delta="-1" aria-label="Mniej" ${value <= min ? 'disabled' : ''}>−</button>
        <output aria-live="polite">${value}</output>
        <button type="button" data-action="${action}" data-key="${key}" data-delta="1" aria-label="Więcej" ${value >= max ? 'disabled' : ''}>+</button>
      </span>`;
    }
    const selectHtml = (id, attrs, opts, value) =>
      `<select id="${id}" class="select" ${attrs}>${opts
        .map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value) ? 'selected' : ''}>${esc(l)}</option>`)
        .join('')}</select>`;

    function meter(spent, planned, lim) {
      const used = spent + planned;
      const base = Math.max(lim, used) || 1;
      const over = lim > 0 && used > lim;
      return `<span class="meter2 ${over ? 'over' : ''}" aria-hidden="true">
        <span class="m-spent" style="width:${((spent / base) * 100).toFixed(2)}%"></span><span class="m-planned" style="width:${((planned / base) * 100).toFixed(2)}%"></span>
      </span>`;
    }

    /* ============================================================
       Render
       ============================================================ */
    function render() {
      if (!state.ready) {
        if (state.error) {
          appRoot.innerHTML = `<main style="padding-top:4rem"><section class="card empty"><h2>Nie udało się otworzyć danych</h2><p>${esc(state.error)}</p></section></main>`;
        }
        return;
      }
      const blocked = Boolean(state.sheet);
      const html = `
        ${renderTopbar(blocked)}
        <div class="page" data-key="page-${state.tab}" ${blocked ? 'inert' : ''}>
          ${renderLargeTitle()}
          <main>${renderView()}</main>
        </div>
        ${renderTabbar(blocked)}
        ${state.sheet ? renderSheet() : ''}
        <div class="toast-host" role="status" aria-live="polite" data-key="toast-host">${state.toast ? renderToast() : ''}</div>`;
      morph(appRoot, html);
      afterRender();
    }
    function afterRender() {
      document.documentElement.classList.toggle('locked', Boolean(state.sheet));
      if (state.sheet && state.sheet.focusPending) {
        state.sheet.focusPending = false;
        const target = appRoot.querySelector('.sheet [data-autofocus]') || appRoot.querySelector('#sheet-title');
        if (target) target.focus({ preventScroll: true });
      }
      updateScrolled();
    }
    function updateScrolled() {
      document.documentElement.classList.toggle('scrolled', window.scrollY > 36);
    }
    let scrollTick = false;
    window.addEventListener(
      'scroll',
      () => {
        if (scrollTick) return;
        scrollTick = true;
        requestAnimationFrame(() => {
          scrollTick = false;
          updateScrolled();
        });
      },
      { passive: true }
    );

    const TITLES = { list: 'Lista', budget: 'Budżet', settings: 'Ustawienia' };
    function renderTopbar(blocked) {
      const end = state.tab === 'list' ? navIcon('new-item', 'plus', 'Nowa pozycja') : '';
      return `<header class="topbar" data-key="topbar" ${blocked ? 'inert' : ''}>
        <div class="topbar-inner">
          <div class="topbar-side"></div>
          <div class="topbar-title" aria-hidden="true">${TITLES[state.tab]}</div>
          <div class="topbar-side end">${end}</div>
        </div>
      </header>`;
    }
    function renderLargeTitle() {
      return `<div class="large-title"><h1>${TITLES[state.tab]}</h1></div>`;
    }
    const TABS = [
      ['list', 'Lista', 'tabList'],
      ['budget', 'Budżet', 'tabBudget'],
      ['settings', 'Ustawienia', 'tabSettings']
    ];
    function renderTabbar(blocked) {
      return `<nav class="tabbar" aria-label="Sekcje" data-key="tabbar" ${blocked ? 'inert' : ''}>
        <div class="tabbar-inner">${TABS.map(
          ([id, label, ic]) =>
            `<button type="button" class="tab" data-action="tab" data-tab="${id}" ${state.tab === id ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></button>`
        ).join('')}</div>
      </nav>`;
    }
    function renderView() {
      if (state.tab === 'budget') return viewBudget();
      if (state.tab === 'settings') return viewSettings();
      return viewList();
    }

    /* ---------- Lista ---------- */
    function budgetPeek() {
      const m = curMonth();
      const s = monthSummary(m);
      const lim = limit();
      const p = s.pleasure;
      const used = p.spent + p.planned;
      const nec = s.necessary.spent + s.necessary.planned;
      const over = lim > 0 && used > lim;
      const left = lim > 0 ? (over ? `Ponad limit o ${fmtMoney(used - lim)}` : `Zostaje ${fmtMoney(lim - used)}`) : '';
      return `<button type="button" class="card peek" data-action="tab" data-tab="budget" data-key="peek">
        <span class="peek-top">
          <span class="peek-month">${cap(monthName(m))}</span>
          <span class="peek-amount">${lim > 0 ? `${fmtAmt(used)} <span class="of">z ${fmtMoney(lim)}</span>` : fmtMoney(used)}</span>
        </span>
        ${lim > 0 ? meter(p.spent, p.planned, lim) : ''}
        <span class="peek-foot">
          <span class="${over ? 'over' : ''}">${left || 'Przyjemności'}</span>
          ${nec ? `<span>Konieczne ${fmtMoney(nec)}</span>` : ''}
        </span>
      </button>`;
    }
    function itemMeta(it, showCat) {
      const meta = [];
      if (showCat && it.category) meta.push(esc(it.category));
      if (it.stage === 'lista') {
        if (it.plannedMonth) meta.push(esc(monthLabel(it.plannedMonth)));
        const n = (it.variants || []).length;
        if (n > 1 && !selectedOption(it)) meta.push(pl(n, 'opcja', 'opcje', 'opcji'));
        if (state.settings.enableCoolingHighlight !== false) {
          const days = daysBetween(it.createdAt, state.today);
          if (days >= (Number(state.settings.coolingDaysHighlight) || 14)) meta.push(`<span class="meta-wait">od ${days} dni</span>`);
        }
      } else if (it.stage === 'kupuje') {
        if (isOverdue(it)) meta.push(`<span class="meta-warn">zaległe od ${esc(monthGen(it.plannedMonth))}</span>`);
        else if (effMonth(it) !== curMonth()) meta.push(esc(monthLabel(effMonth(it))));
        const inst = instOf(it);
        if (inst) meta.push(`${pl(inst.count, 'rata', 'raty', 'rat')} po ${fmtMoney(itemCost(it) / inst.count)}`);
      }
      return meta;
    }
    function itemRow(it, showCat) {
      const meta = itemMeta(it, showCat);
      const price = priceLabel(it);
      const check =
        it.stage === 'kupuje'
          ? `<button type="button" class="check" data-action="buy" data-id="${esc(it.id)}" aria-label="Kupione: ${esc(it.name)}"><span class="check-ring">${icon('check')}</span></button>`
          : '';
      return `<li data-key="it-${esc(it.id)}"><div class="row item-row">
        ${check}
        <button type="button" class="row-main" data-action="open-item" data-id="${esc(it.id)}">
          <span class="row-text"><span class="row-title">${esc(it.name)}</span>${meta.length ? `<span class="row-meta"><span>${meta.join(' · ')}</span></span>` : ''}</span>
          <span class="price ${price ? '' : 'none'}">${price || 'bez ceny'}</span>
        </button>
      </div></li>`;
    }
    function viewList() {
      const seg = state.seg;
      const all = state.items.filter((i) => i.stage === seg);
      const count = (s) => state.items.filter((i) => i.stage === s).length;
      const order = new Map(state.categories.map((c, i) => [c.name, i]));
