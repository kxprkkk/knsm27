                    data-action="im-toggle-installments"
                    class="ios-switch ${f.installments.enabled ? 'on-blue' : ''}"
                  >
                    <span class="ios-switch-thumb"></span>
                  </button>
                </div>

                ${
                  f.installments.enabled
                    ? `
                  <div class="ios-row-stack" style="background:var(--bg-subtle);">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                      <span style="font-size:13px; font-weight:600;">Liczba rat:</span>
                      <div style="display:flex; gap:5px; flex-wrap:wrap;">
                        ${[2, 3, 5, 6, 10, 12, 20]
                          .map(
                            (n) => `
                          <button
                            type="button"
                            data-action="im-set-inst-count"
                            data-count="${n}"
                            class="btn ${Number(f.installments.count) === n ? 'btn-primary' : 'btn-outline'}"
                            style="padding:5px 9px; font-size:12px;"
                          >${n}</button>
                        `
                          )
                          .join('')}
                      </div>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                      <div>
                        <span style="font-size:11px; color:var(--text-secondary);">Liczba rat (własna)</span>
                        <input id="im-inst-count" type="number" min="2" max="60" value="${escapeHtml(f.installments.count)}" style="width:100%; background:var(--bg-card);" />
                      </div>
                      <div>
                        <span style="font-size:11px; color:var(--text-secondary);">Rata mies. (${currency})</span>
                        <input
                          id="im-inst-monthly"
                          type="number"
                          step="0.01"
                          placeholder="${autoMonthly || 'np. 50'}"
                          value="${escapeHtml(f.installments.monthlyAmount)}"
                          style="width:100%; background:var(--bg-card);"
                        />
                      </div>
                    </div>

                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <span style="font-size:13px; font-weight:600;">Pierwsza rata od (miesiąc):</span>
                      <input id="im-inst-start" type="month" value="${escapeHtml(f.installments.startMonth)}" style="background:var(--bg-card);" />
                    </div>

                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <span style="font-size:13px; font-weight:600;">Raty 0% (bez kosztów kredytu)</span>
                      <button
                        type="button"
                        role="switch"
                        aria-checked="${f.installments.zeroPercent}"
                        data-action="im-toggle-zero-pct"
                        class="ios-switch ${f.installments.zeroPercent ? 'on' : ''}"
                      >
                        <span class="ios-switch-thumb"></span>
                      </button>
                    </div>

                    <div style="padding:9px 11px; border-radius:10px; background:var(--bg-card); font-size:12px; color:var(--ios-blue); font-weight:600;">
                      Podsumowanie rat: ${formatMoney(effectiveMonthly, currency)} / mies. (${instCount} rat${f.installments.zeroPercent ? ' 0%' : ''}) od ${formatShortMonthYear(f.installments.startMonth || f.plannedMonth || state.currentMonthStr)} do ${formatShortMonthYear(previewEndMonth)}
                    </div>
                  </div>
                `
                    : ''
                }
              </div>

              <!-- 3. ROZWAŻANE MODELE / WARIANTY (NP. MODEL 1 + LINK, MODEL 2 + LINK, MODEL 3 + LINK) -->
              <div class="ios-section-title">
                <span>Rozważane modele / warianty (${f.variants.length})</span>
                <button type="button" data-action="im-add-variant" style="text-transform:none; color:var(--ios-blue); font-weight:700;">
                  + Dodaj model
                </button>
              </div>
              <div class="ios-card">
                ${
                  f.variants.length === 0
                    ? `<div class="ios-row">
                        <div class="row-info">
                          <div class="row-subtitle">Porównujesz kilka opcji (np. Plecak: Model 1 + link, Model 2 + link)? Dodaj warianty poniżej.</div>
                        </div>
                        <button type="button" data-action="im-add-variant" class="btn btn-secondary" style="font-size:12px;">+ Model 1</button>
                      </div>`
                    : f.variants
                        .map(
                          (v, idx) => `
                        <div class="ios-row-stack">
                          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                            <button
                              type="button"
                              data-action="im-select-variant-fav"
                              data-index="${idx}"
                              style="font-size:13px; font-weight:700; color:${v.selected ? 'var(--ios-blue)' : 'var(--text-primary)'};"
                            >
                              ★ Model ${idx + 1} ${v.selected ? '(Wybrany faworyt)' : '(Dotknij, by wybrać)'}
                            </button>
                            <button type="button" data-action="im-remove-variant" data-index="${idx}" class="btn-icon-x" style="width:26px; height:26px;">×</button>
                          </div>
                          <div style="display:grid; grid-template-columns:2fr 1fr; gap:8px;">
                            <input
                              id="im-var-name-${idx}"
                              type="text"
                              placeholder="Nazwa modelu, np. Osprey Arcane..."
                              value="${escapeHtml(v.name)}"
                              style="width:100%;"
                            />
                            <input
                              id="im-var-price-${idx}"
                              type="number"
                              step="1"
                              placeholder="Cena (${currency})"
                              value="${escapeHtml(v.price)}"
                              style="width:100%;"
                            />
                          </div>
                          <input
                            id="im-var-url-${idx}"
                            type="url"
                            placeholder="Link URL do sklepu (https://...)"
                            value="${escapeHtml(v.url)}"
                            style="width:100%;"
                          />
                          <input
                            id="im-var-note-${idx}"
                            type="text"
                            placeholder="Zalety / wady modelu (opcjonalnie)..."
                            value="${escapeHtml(v.note || '')}"
                            style="width:100%;"
                          />
                        </div>
                      `
                        )
                        .join('')
                }
                <div class="ios-row">
                  <button type="button" data-action="im-add-variant" class="btn btn-secondary" style="width:100%;">
                    + Dodaj kolejny rozważany model
                  </button>
                </div>
              </div>

              <!-- 4. GŁÓWNY LINK URL I NOTATKA -->
              <div class="ios-card">
                <div class="ios-row-stack">
                  <label for="im-url" style="font-size:12px; font-weight:600; color:var(--text-secondary);">GŁÓWNY LINK URL (OPCJONALNIE)</label>
                  <input id="im-url" type="url" placeholder="https://..." value="${escapeHtml(f.url)}" style="width:100%;" />
                </div>

                <div class="ios-row-stack">
                  <label for="im-note" style="font-size:12px; font-weight:600; color:var(--text-secondary);">NOTATKA / PARAMETRY</label>
                  <input id="im-note" type="text" placeholder="np. Czarny mat, pojemność 20L, kod rabatowy..." value="${escapeHtml(f.note)}" style="width:100%;" />
                </div>

                ${
                  ['resigned', 'postponed', 'changed'].includes(f.stage)
                    ? `<div class="ios-row-stack">
                        <label for="im-res-note" style="font-size:12px; font-weight:600; color:var(--text-secondary);">POWÓD ZMIANY PLANU / PRZESUNIĘCIA / REZYGNACJI</label>
                        <input id="im-res-note" type="text" placeholder="np. Przesunięte na wiosnę..." value="${escapeHtml(f.resolutionNote)}" style="width:100%;" />
                      </div>`
                    : ''
                }
              </div>

              <button type="button" data-action="save-item-modal" class="btn btn-primary" style="width:100%; padding:13px; font-size:15px;">
                ✓ Zapisz pozycję
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderCompleteItemModal() {
      const item = state.completeModalItem;
      if (!item) return '';
      const currency = state.settings.currency || 'zł';

      return `
        <div class="modal-backdrop" role="dialog" aria-modal="true">
          <div class="modal-sheet">
            <div class="modal-topbar">
              <button type="button" data-action="close-complete-modal" style="color:var(--text-secondary);">Anuluj</button>
              <span style="font-size:16px; font-weight:700;">Oznacz jako zrealizowane</span>
              <button type="button" data-action="confirm-complete-modal" style="font-weight:700; color:var(--ios-green);">Zatwierdź</button>
            </div>
            <div class="modal-body">
              <div class="ios-card">
                <div class="ios-row-stack">
                  <div class="row-title">${escapeHtml(item.name)}</div>
                  <div class="row-subtitle">
                    Możesz potwierdzić ostateczną kwotę zakupu/usługi lub zostawić dotychczasową wycenę.
                  </div>
                </div>
                <div class="ios-row">
                  <label for="cm-final-price" class="row-title">Ostateczna kwota (${currency})</label>
                  <input
                    id="cm-final-price"
                    type="number"
                    step="0.01"
                    inputmode="decimal"
                    placeholder="Opcjonalnie"
                    value="${escapeHtml(state.completeFinalPrice)}"
                    style="width:130px; text-align:right; font-weight:700;"
                  />
                </div>
              </div>
              <button type="button" data-action="confirm-complete-modal" class="btn btn-success" style="width:100%; padding:12px;">
                ✓ Oznacz jako Zrealizowane
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderStatusChangeModal() {
      const item = state.statusChangeModalItem;
      if (!item) return '';
      const targetMeta = STAGES_META[state.statusChangeTarget] || STAGES_META.postponed;

      return `
        <div class="modal-backdrop" role="dialog" aria-modal="true">
          <div class="modal-sheet">
            <div class="modal-topbar">
              <button type="button" data-action="close-status-change-modal" style="color:var(--text-secondary);">Anuluj</button>
              <span style="font-size:16px; font-weight:700;">Decyzja: ${targetMeta.label}</span>
              <button type="button" data-action="confirm-status-change-modal" style="font-weight:700; color:var(--ios-blue);">Zapisz</button>
            </div>
            <div class="modal-body">
              <div class="ios-card">
                <div class="ios-row-stack">
                  <div class="row-title">${escapeHtml(item.name)}</div>
                  <div class="ios-segmented cols-3">
                    <button type="button" data-action="scm-set-target" data-target="postponed" class="ios-segment-btn ${state.statusChangeTarget === 'postponed' ? 'active' : ''}">Przesunięcie</button>
                    <button type="button" data-action="scm-set-target" data-target="changed" class="ios-segment-btn ${state.statusChangeTarget === 'changed' ? 'active' : ''}">Zmiana planu</button>
                    <button type="button" data-action="scm-set-target" data-target="resigned" class="ios-segment-btn ${state.statusChangeTarget === 'resigned' ? 'active' : ''}">Rezygnacja</button>
                  </div>
                </div>

                ${
                  state.statusChangeTarget === 'postponed'
                    ? `<div class="ios-row">
                        <label for="scm-new-month" class="row-title">Nowy planowany miesiąc (opcj.)</label>
                        <input id="scm-new-month" type="month" value="${escapeHtml(state.statusChangeNewMonth)}" />
                      </div>`
                    : ''
                }

                <div class="ios-row-stack">
                  <label for="scm-note" style="font-size:12px; font-weight:600; color:var(--text-secondary);">KRÓTKA NOTATKA DO DECYZJI (OPCJONALNIE)</label>
                  <input
                    id="scm-note"
                    type="text"
                    placeholder="np. Przeniesione na kolejny kwartał, zmiana koncepcji..."
                    value="${escapeHtml(state.statusChangeNote)}"
                    style="width:100%;"
                  />
                </div>
              </div>

              <button type="button" data-action="confirm-status-change-modal" class="btn btn-primary" style="width:100%; padding:12px;">
                Zatwierdź status: ${targetMeta.label}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderBottomNav() {
      const t = state.activeTab;
      return `
        <nav class="bottom-nav" aria-label="Główna nawigacja">
          <div class="bottom-nav-inner">
            <button type="button" data-action="switch-tab" data-tab="list" class="nav-tab-btn ${t === 'list' ? 'active' : ''}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${t === 'list' ? '2.4' : '1.9'}">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
              </svg>
              <span>Lista</span>
            </button>

            <button type="button" data-action="switch-tab" data-tab="budget" class="nav-tab-btn ${t === 'budget' ? 'active' : ''}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${t === 'budget' ? '2.4' : '1.9'}">
                <rect x="3" y="4" width="18" height="18" rx="3" />
                <path stroke-linecap="round" d="M16 2v4M8 2v4M3 10h18" />
              </svg>
              <span>Budżet i Plan</span>
            </button>

            <button type="button" data-action="switch-tab" data-tab="settings" class="nav-tab-btn ${t === 'settings' ? 'active' : ''}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${t === 'settings' ? '2.4' : '1.9'}">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
              <span>Ustawienia</span>
            </button>
          </div>
        </nav>
      `;
    }

    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      let mainHtml = '';
      if (state.activeTab === 'list') mainHtml = renderListView();
      else if (state.activeTab === 'budget') mainHtml = renderBudgetView();
      else mainHtml = renderSettingsView();

      root.innerHTML = `
        ${state.toast ? `<div class="toast-banner">${escapeHtml(state.toast)}</div>` : ''}
        ${renderStickyHeader()}
        <main class="main-container">${mainHtml}</main>
        ${renderBottomNav()}
        ${renderItemModal()}
        ${renderCompleteItemModal()}
        ${renderStatusChangeModal()}
      `;
    }

    /***********************************************************************
     * 13. OBSŁUGA ZDARZEŃ I AKCJI UŻYTKOWNIKA
     ***********************************************************************/
    document.addEventListener('change', async (e) => {
      const el = e.target;
      if (!el) return;
      if (el.getAttribute('data-action') === 'settings-monthly-limit-input') {
        const val = Math.max(0, Number(el.value) || 0);
        await updateSettings({ monthlyLimit: val });
        showToast('Zaktualizowano miesięczny limit.');
      }
    });

    document.addEventListener('submit', async (e) => {
      if (e.target && e.target.id === 'quick-add-item-form') {
        e.preventDefault();
        const inp = document.getElementById('quick-add-name-input');
        const name = inp?.value.trim();
        if (!name) return;

        const targetStage =
          state.listStageFilter !== 'all_active' ? state.listStageFilter : 'chce';
        const targetKind =
          state.listKindFilter !== 'all' ? state.listKindFilter : 'zakup';
        const targetCat =
          state.listCategoryFilter !== 'Wszystkie'
            ? state.listCategoryFilter
            : state.categories[0] || 'Inne';

        const newItem = {
          id: generateId('item'),
          name,
          stage: targetStage,
          itemKind: targetKind,
          priority: targetKind === 'konieczne' ? 'critical' : 'normal',
          category: targetCat,
          priceMode: 'exact',
          price: '',
          priceMin: '',
          priceMax: '',
          finalPrice: '',
          plannedMonth: state.currentMonthStr,
          url: '',
          note: '',
          resolutionNote: '',
          createdAt: state.todayStr,
          completedAt: '',
          installments: {
            enabled: false,
            count: 3,
            monthlyAmount: '',
            zeroPercent: true,
            startMonth: state.currentMonthStr
          },
          variants: [],
          updatedAt: Date.now()
        };

        await dbPut('items', newItem);
        state.items.push(newItem);
        if (inp) inp.value = '';
        showToast(`Dodano do „${STAGES_META[targetStage].label}”: ${name}`);
        renderApp();
      }
    });

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.getAttribute('data-action');

      switch (action) {
        case 'switch-tab':
          state.activeTab = btn.getAttribute('data-tab') || 'list';
          state.inlineDeleteItemId = null;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          break;
        case 'set-stage-filter':
          state.listStageFilter = btn.getAttribute('data-stage') || 'all_active';
          renderApp();
          break;
        case 'set-kind-filter':
          state.listKindFilter = btn.getAttribute('data-kind') || 'all';
          renderApp();
          break;
        case 'set-category-filter':
          state.listCategoryFilter = btn.getAttribute('data-category') || 'Wszystkie';
          renderApp();
          break;
        case 'toggle-expand-item': {
          const id = btn.getAttribute('data-item-id');
          state.expandedItemId = state.expandedItemId === id ? null : id;
          renderApp();
          break;
        }
        case 'open-add-item':
          openItemModal(null);
          break;
        case 'edit-item': {
          const id = btn.getAttribute('data-item-id');
          const it = state.items.find((x) => x.id === id);
          if (it) openItemModal(it);
          break;
        }
        case 'close-item-modal':
          state.itemModalOpen = false;
          state.itemForm = null;
          renderApp();
          break;
        case 'save-item-modal':
          await saveItemModalForm();
          break;
        case 'im-set-stage':
          syncItemModalInputs();
          if (state.itemForm) {
            state.itemForm.stage = btn.getAttribute('data-stage') || 'rozwazam';
            renderApp();
          }
          break;
        case 'im-set-kind':
          syncItemModalInputs();
          if (state.itemForm) {
            state.itemForm.itemKind = btn.getAttribute('data-kind') || 'zakup';
            if (state.itemForm.itemKind === 'konieczne') {
              state.itemForm.priority = 'critical';
            }
            renderApp();
          }
          break;
        case 'im-set-priority':
          syncItemModalInputs();
          if (state.itemForm) {
            state.itemForm.priority = btn.getAttribute('data-priority') || 'normal';
            renderApp();
          }
          break;
        case 'im-set-price-mode':
          syncItemModalInputs();
          if (state.itemForm) {
            state.itemForm.priceMode = btn.getAttribute('data-mode') || 'exact';
            renderApp();
          }
          break;
        case 'im-toggle-installments':
          syncItemModalInputs();
          if (state.itemForm) {
            state.itemForm.installments.enabled = !state.itemForm.installments.enabled;
            renderApp();
          }
          break;
        case 'im-set-inst-count':
          syncItemModalInputs();
          if (state.itemForm) {
            state.itemForm.installments.count = Number(btn.getAttribute('data-count')) || 3;
            state.itemForm.installments.monthlyAmount = '';
            renderApp();
          }
          break;
        case 'im-toggle-zero-pct':
          syncItemModalInputs();
          if (state.itemForm) {
            state.itemForm.installments.zeroPercent = !state.itemForm.installments.zeroPercent;
            renderApp();
          }
          break;
        case 'im-add-variant':
          syncItemModalInputs();
          if (state.itemForm) {
            state.itemForm.variants.push({
              id: generateId('var'),
              name: '',
              price: '',
              url: '',
              note: '',
              selected: state.itemForm.variants.length === 0
            });
            renderApp();
          }
          break;
        case 'im-remove-variant': {
          syncItemModalInputs();
          const idx = Number(btn.getAttribute('data-index'));
          if (state.itemForm && state.itemForm.variants[idx]) {
            state.itemForm.variants.splice(idx, 1);
            renderApp();
          }
          break;
        }
        case 'im-select-variant-fav': {
          syncItemModalInputs();
          const idx = Number(btn.getAttribute('data-index'));
          if (state.itemForm && state.itemForm.variants[idx]) {
            state.itemForm.variants.forEach((v, i) => {
              v.selected = i === idx ? !v.selected : false;
            });
            const chosen = state.itemForm.variants.find((v) => v.selected);
            if (chosen && chosen.price && !state.itemForm.price) {
              state.itemForm.price = chosen.price;
            }
            renderApp();
          }
          break;
        }
        case 'select-item-variant': {
          const itemId = btn.getAttribute('data-item-id');
          const varId = btn.getAttribute('data-var-id');
          const item = state.items.find((x) => x.id === itemId);
          if (item && Array.isArray(item.variants)) {
            item.variants.forEach((v) => {
              v.selected = v.id === varId ? !v.selected : false;
            });
            item.updatedAt = Date.now();
            await dbPut('items', item);
            renderApp();
          }
          break;
        }
        case 'quick-set-stage': {
          const itemId = btn.getAttribute('data-item-id');
          const nextStage = btn.getAttribute('data-stage');
          const item = state.items.find((x) => x.id === itemId);
          if (item && nextStage) {
            item.stage = nextStage;
            item.updatedAt = Date.now();
            await dbPut('items', item);
            showToast(`Przeniesiono do: ${STAGES_META[nextStage].label}`);
            renderApp();
          }
          break;
        }
        case 'open-complete-modal': {
          const itemId = btn.getAttribute('data-item-id');
          const item = state.items.find((x) => x.id === itemId);
          if (item) {
            state.completeModalItem = item;
            const eff = getEffectiveItemTotalCost(item);
            state.completeFinalPrice = eff > 0 ? eff : '';
            renderApp();
          }
          break;
        }
        case 'close-complete-modal':
          state.completeModalItem = null;
          state.completeFinalPrice = '';
          renderApp();
          break;
        case 'confirm-complete-modal': {
          const item = state.completeModalItem;
          if (item) {
            const rawPrice = document.getElementById('cm-final-price')?.value;
            if (rawPrice !== undefined && rawPrice !== '') {
              item.finalPrice = Number(String(rawPrice).replace(',', '.')) || item.price;
            }
            item.stage = 'done';
            item.completedAt = state.todayStr;
            item.updatedAt = Date.now();
            await dbPut('items', item);
            state.completeModalItem = null;
            showToast(`Zrealizowano: ${item.name}`);
            renderApp();
          }
          break;
        }
        case 'open-status-change-modal': {
          const itemId = btn.getAttribute('data-item-id');
          const target = btn.getAttribute('data-target') || 'postponed';
          const item = state.items.find((x) => x.id === itemId);
          if (item) {
            state.statusChangeModalItem = item;
            state.statusChangeTarget = target;
            state.statusChangeNote = item.resolutionNote || '';
            state.statusChangeNewMonth = addMonthsToMonthStr(item.plannedMonth || state.currentMonthStr, 1);
            renderApp();
          }
          break;
        }
        case 'close-status-change-modal':
          state.statusChangeModalItem = null;
          renderApp();
          break;
        case 'scm-set-target': {
          const noteEl = document.getElementById('scm-note');
          if (noteEl) state.statusChangeNote = noteEl.value;
          state.statusChangeTarget = btn.getAttribute('data-target') || 'postponed';
          renderApp();
          break;
        }
        case 'confirm-status-change-modal': {
          const item = state.statusChangeModalItem;
          if (item) {
            const noteVal = document.getElementById('scm-note')?.value.trim() || '';
            const newMonthVal = document.getElementById('scm-new-month')?.value || '';
            item.stage = state.statusChangeTarget;
            item.resolutionNote = noteVal;
            if (state.statusChangeTarget === 'postponed' && newMonthVal) {
              item.plannedMonth = newMonthVal;
            }
            item.updatedAt = Date.now();
            await dbPut('items', item);
            state.statusChangeModalItem = null;
            showToast(`Zapisano status: ${STAGES_META[item.stage].label}`);
            renderApp();
          }
          break;
        }
        case 'set-budget-subtab':
          state.budgetSubTab = btn.getAttribute('data-subtab') || 'monthly';
          renderApp();
          break;
        case 'budget-prev-month':
          state.selectedBudgetMonth = addMonthsToMonthStr(state.selectedBudgetMonth, -1);
          renderApp();
          break;
        case 'budget-next-month':
          state.selectedBudgetMonth = addMonthsToMonthStr(state.selectedBudgetMonth, 1);
          renderApp();
          break;
        case 'budget-jump-current-month':
          state.selectedBudgetMonth = state.currentMonthStr;
          renderApp();
          break;
        case 'set-theme':
          await updateSettings({ theme: btn.getAttribute('data-theme') || 'system' });
          break;
        case 'toggle-dark-mode-switch':
          await updateSettings({ theme: isDarkActive() ? 'light' : 'dark' });
          break;
        case 'set-currency':
          await updateSettings({ currency: btn.getAttribute('data-currency') || 'zł' });
          break;
        case 'toggle-cooling-highlight':
          await updateSettings({
            enableCoolingHighlight: state.settings.enableCoolingHighlight === false
          });
          break;
        case 'set-cooling-days':
          await updateSettings({
            coolingDaysHighlight: Number(btn.getAttribute('data-days')) || 14
          });
          break;
        case 'inline-ask-delete-item':
          state.inlineDeleteItemId = btn.getAttribute('data-item-id');
          renderApp();
          break;
        case 'inline-cancel-delete-item':
          state.inlineDeleteItemId = null;
          renderApp();
          break;
        case 'inline-confirm-delete-item': {
          const id = btn.getAttribute('data-item-id');
          await deleteItemEverywhere(id);
          break;
        }
        case 'add-custom-category': {
          const inp = document.getElementById('new-category-input');
          const name = inp?.value.trim();
          if (name && !state.categories.includes(name)) {
            state.categories.push(name);
            await dbPut('categories', { id: generateId('cat'), name });
            showToast(`Dodano kategorię: ${name}`);
            renderApp();
          }
          break;
        }
        case 'export-json': {
          const payload = {
            schemaVersion: DB_VERSION,
            exportedAt: new Date().toISOString(),
            app: 'Konsumpcja',
            items: state.items,
            categories: state.categories.map((name, i) => ({ id: `cat_${i}`, name })),
            settings: state.settings
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `konsumpcja-kopia-${state.todayStr}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('Pobrano kopię zapasową JSON.');
          break;
        }
        case 'import-json-trigger':
          document.getElementById('backup-file-input')?.click();
          break;
        case 'cancel-import-json':
          state.pendingBackupImport = null;
          renderApp();
          break;
        case 'confirm-import-json':
          if (state.pendingBackupImport) {
            await dbRestoreBackup(state.pendingBackupImport);
            state.pendingBackupImport = null;
            await loadAllData();
            showToast('Odtworzono dane z kopii JSON.');
          }
          break;
        case 'export-csv-items':
          exportItemsAndVariantsToCSV();
          showToast('Pobrano plik CSV (Lista i modele).');
          break;
        case 'export-csv-installments':
          exportMonthlyInstallmentsToCSV();
          showToast('Pobrano plik CSV (Raty i miesiące).');
          break;
        case 'ask-clear-all-data':
          state.confirmClearAllData = true;
          renderApp();
          break;
        case 'cancel-clear-all-data':
          state.confirmClearAllData = false;
          renderApp();
          break;
        case 'confirm-clear-all-data':
          await dbClearAllData();
          state.confirmClearAllData = false;
          await loadAllData();
          showToast('Wyczyszczono wszystkie dane z bazy.');
          break;
        case 'run-unit-tests':
          state.unitTestResults = runBuiltInUnitTests();
          renderApp();
          break;
        case 'hide-unit-tests':
          state.unitTestResults = null;
          renderApp();
          break;
      }
    });

    document.getElementById('backup-file-input')?.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      try {
        const text = await file.text();
        const raw = JSON.parse(text);
        state.pendingBackupImport = validateBackupPayload(raw);
        renderApp();
      } catch (err) {
        showToast(err instanceof Error ? err.message : 'Nieprawidłowy plik kopii zapasowej JSON.');
      }
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (state.settings.theme === 'system') applyTheme();
    });

    initPWA();
    loadAllData();
  </script>
</body>
</html>
