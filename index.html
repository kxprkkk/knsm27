      const used = [...new Set(all.map((i) => i.category).filter(Boolean))].sort((a, b) => (order.get(a) ?? 999) - (order.get(b) ?? 999));
      if (state.cat && !used.includes(state.cat)) state.cat = '';
      const items = (state.cat ? all.filter((i) => i.category === state.cat) : all).sort((a, b) =>
        seg === 'kupuje'
          ? effMonth(a).localeCompare(effMonth(b)) || a.name.localeCompare(b.name, 'pl')
          : (b.createdAt || '').localeCompare(a.createdAt || '') || (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0)
      );
      const nec = items.filter((i) => i.necessary);
      const rest = items.filter((i) => !i.necessary);
      const listCls = seg === 'kupuje' ? 'card list with-check' : 'card list';
      const showCat = !state.cat;
      const group = (label, list, key) =>
        list.length
          ? `<section class="section" data-key="${key}">${label ? `<h2 class="group-label">${label}</h2>` : ''}<ul class="${listCls}">${list
              .map((it) => itemRow(it, showCat))
              .join('')}</ul></section>`
          : '';
      const segLabel = (s, l) => `${l}<span class="seg-n">${count(s) || ''}</span>`;
      const chips =
        used.length > 1
          ? `<div class="chip-scroll" role="group" aria-label="Kategoria" data-key="chips">${[['', 'Wszystkie'], ...used.map((c) => [c, c])]
              .map(([v, l]) => `<button type="button" class="chip" data-action="set-cat" data-value="${esc(v)}" aria-pressed="${state.cat === v}">${esc(l)}</button>`)
              .join('')}</div>`
          : '';
      const empty =
        seg === 'lista'
          ? `<section class="card empty" data-key="empty-lista"><h2>Lista jest pusta</h2><p>Zapisz tu rzecz, którą chcesz kupić. Decyzję podejmiesz później.</p><button type="button" class="btn btn-tinted" data-action="new-item">Dodaj pozycję</button></section>`
          : `<section class="card empty" data-key="empty-kupuje"><h2>Nic nie czeka na zakup</h2><p>Przenieś tu pozycję z listy, gdy zdecydujesz się ją kupić.</p></section>`;
      return `${budgetPeek()}
        <div class="seg-wrap" data-key="seg">${segmented(
          [
            ['lista', segLabel('lista', 'Na liście')],
            ['kupuje', segLabel('kupuje', 'Kupuję')]
          ],
          seg,
          'set-seg',
          'Widok'
        )}</div>
        ${chips}
        ${
          items.length
            ? `${group(nec.length ? 'Konieczne' : '', nec, 'g-nec')}${group(nec.length ? 'Przyjemności' : '', rest, 'g-rest')}`
            : all.length
            ? ''
            : empty
        }`;
    }

    /* ---------- Budżet ---------- */
    function lineRow(it, imp, kind) {
      const meta = [];
      if (kind === 'bought') {
        if (imp.count) meta.push(`rata ${imp.index} z ${imp.count}`);
        meta.push(imp.count && imp.index > 1 ? `kupione ${esc(dateLabel(it.completedAt))}` : esc(dateLabel(it.completedAt)));
      } else if (kind === 'planned') {
        if (isOverdue(it)) meta.push('<span class="meta-warn">zaległe</span>');
        if (imp.count) meta.push(`rata ${imp.index} z ${imp.count}`);
      } else if (kind === 'resigned') {
        if (it.resolutionNote) meta.push(esc(it.resolutionNote));
      }
      if (it.necessary && kind !== 'resigned') meta.push('<span class="meta-nec">konieczne</span>');
      let value;
      if (kind === 'resigned' || kind === 'listed') value = priceLabel(it) || '—';
      else value = imp.count || !isEstimate(it) ? fmtMoney(imp.amount) : approx(it, imp.amount);
      return `<li data-key="bl-${kind}-${esc(it.id)}"><div class="row">
        <button type="button" class="row-main" data-action="open-item" data-id="${esc(it.id)}">
          <span class="row-text"><span class="row-title">${esc(it.name)}</span>${meta.length ? `<span class="row-meta"><span>${meta.join(' · ')}</span></span>` : ''}</span>
          <span class="price ${kind === 'resigned' ? 'muted' : ''}">${value}</span>
        </button>
      </div></li>`;
    }
    function viewBudget() {
      const m = state.month;
      const cur = curMonth();
      const s = monthSummary(m);
      const lim = limit();
      const p = s.pleasure;
      const n = s.necessary;
      const used = p.spent + p.planned;
      const nec = n.spent + n.planned;
      const over = lim > 0 && used > lim;
      const legend = (b) =>
        [b.spent || !b.planned ? `<span><i class="lg spent"></i>Kupione ${fmtMoney(b.spent)}</span>` : '', b.planned ? `<span><i class="lg planned"></i>Zaplanowane ${fmtMoney(b.planned)}</span>` : '']
          .filter(Boolean)
          .join('');
      const isEmpty = !s.bought.length && !s.planned.length && !s.listed.length && !s.resigned.length;
      const section = (title, list, note = '', extra = '') =>
        list.length
          ? `<section class="section" data-key="bs-${esc(title)}">
              <div class="section-head"><h2 class="section-title">${title}</h2>${extra}</div>
              <ul class="card list">${list.join('')}</ul>${note ? `<p class="group-note">${note}</p>` : ''}
            </section>`
          : '';
      return `
        <div class="month-nav" data-key="month-nav">
          <button type="button" class="icon-btn" data-action="month-shift" data-dir="-1" aria-label="Poprzedni miesiąc">${icon('chevL')}</button>
          <div class="month-title">
            <h2 aria-live="polite">${cap(monthName(m))} ${m.slice(0, 4)}</h2>
            ${m === cur ? '<span>Ten miesiąc</span>' : '<button type="button" class="text-btn" data-action="month-today">Wróć do bieżącego</button>'}
          </div>
          <button type="button" class="icon-btn" data-action="month-shift" data-dir="1" aria-label="Następny miesiąc">${icon('chevR')}</button>
        </div>
        <section class="card budget" data-key="budget-card">
          <div class="b-block">
            <div class="b-top"><span class="b-label">Przyjemności</span><span class="b-amount">${lim > 0 ? `${fmtAmt(used)} <span class="of">z ${fmtMoney(lim)}</span>` : fmtMoney(used)}</span></div>
            ${lim > 0 ? meter(p.spent, p.planned, lim) : ''}
            <div class="b-legend">${legend(p)}</div>
            ${lim > 0 ? `<div class="b-left ${over ? 'over' : ''}">${over ? `Ponad limit o ${fmtMoney(used - lim)}` : `Zostaje ${fmtMoney(lim - used)}`}</div>` : ''}
          </div>
          <div class="b-block">
            <div class="b-top"><span class="b-label">Konieczne</span><span class="b-amount sm">${fmtMoney(nec)}</span></div>
            <div class="b-legend">${nec ? legend(n) : '<span>Poza limitem przyjemności</span>'}</div>
          </div>
        </section>
        ${
          isEmpty
            ? `<p class="muted-note center" data-key="b-empty">Nic tu jeszcze nie ma.</p>`
            : `${section('Kupione', s.bought.map((x) => lineRow(x.it, x.imp, 'bought')))}
               ${section('Zaplanowane', s.planned.map((x) => lineRow(x.it, x.imp, 'planned')))}
               ${section('Na liście z terminem', s.listed.map((it) => lineRow(it, null, 'listed')), 'Nie liczą się do budżetu, dopóki nie przeniesiesz ich do „Kupuję”.')}
               ${section(
                 'Rezygnacje',
                 s.resigned.map((it) => lineRow(it, null, 'resigned')),
                 '',
                 s.resignedSum ? `<span class="section-sum">${fmtMoney(s.resignedSum)}</span>` : ''
               )}`
        }`;
    }

    /* ---------- Ustawienia ---------- */
    function viewSettings() {
      const s = state.settings;
      const usage = (name) => state.items.filter((i) => i.category === name).length;
      return `
        <div class="group"><h2 class="group-label">Wygląd</h2>
          <div class="card"><div class="settings-seg">${segmented(
            [
              ['system', 'Automatyczny'],
              ['light', 'Jasny'],
              ['dark', 'Ciemny']
            ],
            s.theme,
            'set-theme',
            'Motyw'
          )}</div></div>
        </div>
        <div class="group"><h2 class="group-label">Budżet</h2>
          <ul class="card list">
            <li class="row"><label class="row-text" for="set-limit"><span class="row-title">Limit na przyjemności</span><span class="row-meta">Na miesiąc</span></label>
              <span class="money-input"><input id="set-limit" class="input-inline" type="text" inputmode="decimal" data-setting="monthlyLimit" value="${esc(inputNum(s.monthlyLimit))}" placeholder="0" /><span aria-hidden="true">zł</span></span></li>
          </ul>
          <p class="group-note">Wydatki konieczne liczą się osobno. Bez limitu wpisz 0.</p>
        </div>
        <div class="group"><h2 class="group-label">Lista</h2>
          <ul class="card list">
            ${switchRow('Licznik dni na liście', 'Pokazuje, jak długo coś czeka na decyzję', s.enableCoolingHighlight !== false, 'toggle-setting', 'enableCoolingHighlight')}
            ${
              s.enableCoolingHighlight !== false
                ? `<li><div class="field-stack"><span class="field-label">Pokazuj po</span>${segmented(
                    [
                      [7, '7 dniach'],
                      [14, '14 dniach'],
                      [30, '30 dniach']
                    ],
                    Number(s.coolingDaysHighlight) || 14,
                    'set-cooling',
                    'Pokazuj licznik po'
                  )}</div></li>`
                : ''
            }
          </ul>
        </div>
        <div class="group"><h2 class="group-label">Kategorie</h2>
          <ul class="card list">
            ${state.categories
              .map((c) => navRow(esc(c.name), 'edit-category', { key: `cat-${esc(c.id)}`, attrs: `data-id="${esc(c.id)}"`, value: usage(c.name) ? String(usage(c.name)) : '' }))
              .join('')}
            ${actionRow('Dodaj kategorię', 'new-category')}
          </ul>
        </div>
        <div class="group"><h2 class="group-label">Dane</h2>
          <ul class="card list">
            ${actionRow('Zapisz kopię', 'export-json', { sub: 'Plik JSON ze wszystkimi pozycjami' })}
            ${actionRow('Przywróć z kopii', 'import-json')}
          </ul>
          <p class="group-note">Wszystko jest zapisane tylko na tym urządzeniu. Przed usunięciem Konsumpcji z ekranu początkowego zapisz kopię — inaczej dane przepadną.</p>
        </div>
        <div class="group"><ul class="card list">${actionRow('Usuń wszystkie dane', 'clear-all', { tone: 'danger' })}</ul></div>
        <p class="app-foot">Konsumpcja ${APP_VERSION}</p>`;
    }

    /* ---------- Toast ---------- */
    function renderToast() {
      const t = state.toast;
      return `<div class="toast ${t.undo ? 'has-action' : ''} ${t.closing ? 'closing' : ''}" data-key="toast-${t.id}">
        <span>${esc(t.text)}</span>${t.undo ? '<button type="button" class="toast-action" data-action="toast-undo">Cofnij</button>' : ''}
      </div>`;
    }
    let toastTimer = null;
    function toast(text, undo = null) {
      state.toast = { id: Date.now(), text, undo, closing: false };
      render();
      clearTimeout(toastTimer);
      toastTimer = setTimeout(dismissToast, undo ? 5000 : 2600);
    }
    function dismissToast() {
      const t = state.toast;
      if (!t || t.closing) return;
      t.closing = true;
      render();
      setTimeout(() => {
        if (state.toast === t) {
          state.toast = null;
          render();
        }
      }, 200);
    }

    /* ============================================================
       Arkusze
       ============================================================ */
    const sheetBtn = (label, action, primary = false, attrs = '') =>
      `<button type="button" class="sheet-btn ${primary ? 'primary' : ''}" data-action="${action}" ${attrs}>${label}</button>`;

    function renderSheet() {
      const s = state.sheet;
      const builder = SHEETS[s.type];
      const r = builder ? builder(s) : null;
      if (!r) return '';
      const head = r.alert
        ? ''
        : `<header class="sheet-head" data-drag-handle>
            <span class="grabber" aria-hidden="true"></span>
            ${r.left || sheetBtn(s.prev ? 'Wróć' : 'Anuluj', 'sheet-cancel')}
            <h2 class="sheet-title" id="sheet-title" tabindex="-1">${r.title}</h2>
            ${r.right || '<span></span>'}
          </header>`;
      return `<div class="sheet-layer ${s.closing ? 'closing' : ''}" data-key="sheet-layer">
        <div class="scrim" data-action="sheet-dismiss" data-keep-style></div>
        <section class="sheet ${r.cls || ''}" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-keep-style data-key="sheet">
          ${head}
          <div class="sheet-body" data-key="sheet-body-${s.type}">${r.body}</div>
        </section>
      </div>`;
    }
    const alertSheet = (title, text, actions) => ({
      alert: true,
      cls: 'alert-sheet',
      body: `<h2 id="sheet-title" tabindex="-1">${title}</h2>${text ? `<p>${text}</p>` : '<div style="height:1.25rem"></div>'}
        <div class="alert-actions">${actions.map(([label, action, tone]) => `<button type="button" class="btn btn-block ${tone}" data-action="${action}">${label}</button>`).join('')}</div>`
    });

    function statusLine(it) {
      if (it.stage === 'lista') {
        const d = daysBetween(it.createdAt, state.today);
        return `Na liście od ${esc(dateLabel(it.createdAt))}${d > 0 ? ` · ${pl(d, 'dzień', 'dni', 'dni')}` : ''}`;
      }
      if (it.stage === 'kupuje') return isOverdue(it) ? `<span class="meta-warn">Zaległe od ${esc(monthGen(it.plannedMonth))}</span>` : `Kupuję · ${esc(monthLabel(effMonth(it)))}`;
      if (it.stage === 'kupione') return `Kupione ${esc(dateLabel(it.completedAt))}`;
      return `Rezygnacja ${esc(dateLabel(it.resolvedAt))}`;
    }

    const SHEETS = {
      item(s) {
        const it = findItem(s.id);
        if (!it) return null;
        const id = esc(it.id);
        const inst = instOf(it);
        const url = safeUrl(it.url);
        const opts = it.variants || [];
        const primary = {
          lista: ['Kupuję', 'move-kupuje'],
          kupuje: ['Kupione', 'buy']
        }[it.stage];
        const secondary = {
          lista: [
            ['Już kupione', 'buy'],
            ['Rezygnuję', 'resign']
          ],
          kupuje: [
            ['Wróć na listę', 'move-lista'],
            ['Rezygnuję', 'resign']
          ],
          kupione: [
            ['Zmień kwotę lub datę', 'buy'],
            ['Cofnij zakup', 'unbuy']
          ],
          rezygnacja: [['Przywróć na listę', 'restore']]
        }[it.stage];
        const info = [];
        if (ACTIVE.includes(it.stage)) {
          const value = it.stage === 'kupuje' ? effMonth(it) : it.plannedMonth;
          info.push(`<li class="row"><label class="row-text" for="d-month"><span class="row-title">Termin</span></label>${selectHtml(
            'd-month',
            `data-termin="${id}"`,
            monthOptions(value, it.stage === 'lista'),
            value
          )}</li>`);
        }
        if (inst && it.stage !== 'lista' && it.stage !== 'rezygnacja') {
          const start = effMonth(it);
          info.push(`<li class="row"><span class="row-text"><span class="row-title">Raty</span><span class="row-meta">${esc(cap(monthLabel(start)))} – ${esc(monthLabel(addMonths(start, inst.count - 1)))}</span></span>
            <span class="row-value">${inst.count} × ${fmtMoney(itemCost(it) / inst.count)}</span></li>`);
        }
        info.push(`<li class="row"><span class="row-text"><span class="row-title">Kategoria</span></span><span class="row-value">${esc(it.category || 'Bez kategorii')}</span></li>`);
        if (it.stage !== 'rezygnacja') info.push(switchRow('Konieczne', 'Poza limitem przyjemności', it.necessary, 'toggle-necessary', 'nec', `data-id="${id}"`));
        if (url)
          info.push(`<li><div class="row"><a class="row-main" href="${esc(url)}" target="_blank" rel="noopener noreferrer">
            <span class="row-text"><span class="row-title accent">Otwórz link</span><span class="row-meta">${esc(hostOf(url))}</span></span>${icon('external', 'chev')}</a></div></li>`);
        const noteBlock = [
          it.note ? `<div class="note-block"><span class="field-label">Notatka</span><p>${esc(it.note)}</p></div>` : '',
          it.stage === 'rezygnacja' && it.resolutionNote ? `<div class="note-block"><span class="field-label">Powód</span><p>${esc(it.resolutionNote)}</p></div>` : ''
        ].join('');
        const optionRows = opts
          .map((v) => {
            const vu = safeUrl(v.url);
            return `<li data-key="opt-${esc(v.id)}"><div class="row">
              <button type="button" class="row-main" data-action="pick-option" data-id="${id}" data-opt="${esc(v.id)}" aria-pressed="${Boolean(v.selected)}">
                <span class="pick-check" aria-hidden="true">${icon('check')}</span>
                <span class="row-text"><span class="row-title">${esc(v.name || 'Opcja')}</span>${v.note ? `<span class="row-meta">${esc(v.note)}</span>` : ''}</span>
                <span class="price">${num(v.price) ? fmtMoney(v.price) : ''}</span>
              </button>
              ${vu ? `<a class="icon-btn sm" href="${esc(vu)}" target="_blank" rel="noopener noreferrer" aria-label="Otwórz link: ${esc(v.name || 'opcja')}">${icon('external')}</a>` : ''}
            </div></li>`;
          })
          .join('');
        return {
          title: STAGES[it.stage],
          left: sheetBtn(s.prev ? 'Wróć' : 'Zamknij', 'sheet-cancel'),
          right: sheetBtn('Edytuj', 'edit-item', false, `data-id="${id}"`),
          body: `
            <div class="detail">
              <h3 class="detail-name">${esc(it.name)}</h3>
              <p class="detail-price">${priceLabel(it) || '<span class="muted">Bez ceny</span>'}${it.stage === 'kupione' && paid(it) ? '<span class="detail-tag">zapłacono</span>' : ''}</p>
              <p class="detail-status">${statusLine(it)}</p>
            </div>
            ${primary ? `<button type="button" class="btn btn-filled btn-block detail-cta" data-action="${primary[1]}" data-id="${id}">${primary[0]}</button>` : ''}
            ${
              opts.length
                ? `<h3 class="list-label out">Opcje</h3><ul class="card list">${optionRows}</ul>
                   <p class="group-note sheet-note">${selectedOption(it) ? 'Cena wybranej opcji trafia do budżetu.' : 'Zaznacz opcję, którą wybierasz — jej cena trafi do budżetu.'}</p>`
                : ''
            }
            <ul class="card list">${info.join('')}</ul>
            ${noteBlock ? `<div class="card">${noteBlock}</div>` : ''}
            <ul class="card list">${secondary.map(([l, a]) => actionRow(l, a, { attrs: `data-id="${id}"` })).join('')}</ul>
            ${it.stage === 'lista' ? '' : `<p class="detail-foot">Dodano ${esc(dateLabel(it.createdAt))}</p>`}`
        };
      },

      form(s) {
        const f = s.form;
        const isNew = !f.id;
        const sv = f.variants.find((v) => v.selected && parseNum(v.price));
        const p1 = parseNum(f.price);
        const p2 = parseNum(f.priceMax);
        const est = f.stage === 'kupione' ? parseNum(f.paid) || 0 : sv ? parseNum(sv.price) : p1 && p2 ? (p1 + p2) / 2 : p1 || p2 || 0;
        const priceRow =
          f.stage === 'kupione'
            ? `<li class="row"><label class="row-text" for="f-paid"><span class="row-title">Zapłacono</span></label>
                <span class="money-input"><input id="f-paid" class="input-inline" type="text" inputmode="decimal" data-field="paid" value="${esc(f.paid)}" placeholder="0" /><span aria-hidden="true">zł</span></span></li>`
            : sv
            ? `<li class="row"><span class="row-text"><span class="row-title">Cena</span><span class="row-meta">z wybranej opcji</span></span><span class="row-value">${fmtMoney(parseNum(sv.price))}</span></li>`
            : `<li class="row"><span class="row-text" id="f-price-l"><span class="row-title">Cena</span></span>
                <span class="price-range" role="group" aria-labelledby="f-price-l">
                  <input class="input-inline sm" type="text" inputmode="decimal" data-field="price" value="${esc(f.price)}" placeholder="cena" aria-label="Cena" />
                  <span class="dash" aria-hidden="true">–</span>
                  <input class="input-inline sm" type="text" inputmode="decimal" data-field="priceMax" value="${esc(f.priceMax)}" placeholder="do" aria-label="Cena maksymalna, gdy znasz tylko widełki" />
                </span></li>`;
        const catOpts = [['', 'Bez kategorii'], ...state.categories.map((c) => [c.name, c.name])];
        if (f.category && !state.categories.some((c) => c.name === f.category)) catOpts.push([f.category, f.category]);
        const active = ACTIVE.includes(f.stage);
        const showInst = f.stage === 'kupuje' || f.stage === 'kupione';
        const perMonth = f.inst && est ? `po ${fmtMoney(est / f.count)} miesięcznie` : '';
        const optionCards = f.variants
          .map(
            (v, i) => `<div class="card opt-edit" data-key="ov-${esc(v.id)}">
              <div class="opt-head">
                <button type="button" class="opt-pick" data-action="form-pick-option" data-index="${i}" aria-pressed="${Boolean(v.selected)}">
                  <span class="pick-check" aria-hidden="true">${icon('check')}</span>${v.selected ? 'Wybrana' : 'Wybierz'}
                </button>
                <button type="button" class="icon-btn sm" data-action="form-remove-option" data-index="${i}" aria-label="Usuń opcję ${i + 1}">${icon('close')}</button>
              </div>
              <div class="field opt-main">
                <input class="input" type="text" data-var="${i}:name" value="${esc(v.name)}" placeholder="Nazwa, np. model" aria-label="Nazwa opcji ${i + 1}" maxlength="80" enterkeyhint="done" />
                <span class="money-input"><input class="input-inline sm" type="text" inputmode="decimal" data-var="${i}:price" value="${esc(v.price)}" placeholder="cena" aria-label="Cena opcji ${i + 1}" /><span aria-hidden="true">zł</span></span>
              </div>
              <div class="field"><input class="input" type="url" inputmode="url" data-var="${i}:url" value="${esc(v.url)}" placeholder="Link (opcjonalnie)" aria-label="Link opcji ${i + 1}" autocapitalize="off" /></div>
            </div>`
          )
          .join('');
        return {
          title: isNew ? 'Nowa pozycja' : 'Edycja',
          right: sheetBtn(isNew ? 'Dodaj' : 'Zapisz', 'sheet-save', true),
          body: `<form data-form novalidate>
            ${f.error ? `<div class="alert" role="alert">${esc(f.error)}</div>` : ''}
            <div class="card"><div class="field"><input class="input input-name" type="text" data-field="name" value="${esc(f.name)}" placeholder="Nazwa" aria-label="Nazwa" maxlength="80" enterkeyhint="done" ${isNew ? 'data-autofocus' : ''} /></div></div>
            <ul class="card list">
              ${priceRow}
              <li class="row"><label class="row-text" for="f-cat"><span class="row-title">Kategoria</span></label>${selectHtml('f-cat', 'data-field="category"', catOpts, f.category)}</li>
              ${switchRow('Konieczne', 'Poza limitem przyjemności', f.necessary, 'form-toggle', 'necessary')}
            </ul>
            ${
              active || showInst
                ? `<ul class="card list">
                    ${active ? `<li class="row"><label class="row-text" for="f-month"><span class="row-title">Termin</span></label>${selectHtml('f-month', 'data-field="plannedMonth"', monthOptions(f.plannedMonth, f.stage === 'lista'), f.plannedMonth)}</li>` : ''}
                    ${showInst ? switchRow('W ratach', perMonth, f.inst, 'form-toggle', 'inst') : ''}
                    ${showInst && f.inst ? `<li class="row"><span class="row-text"><span class="row-title">Liczba rat</span></span>${stepper(f.count, 'form-step', 'count', 'Liczba rat', 2, 48)}</li>` : ''}
                  </ul>`
                : ''
            }
            ${f.variants.length ? `<h3 class="list-label out">Opcje do porównania</h3>${optionCards}` : ''}
            <ul class="card list">${actionRow(f.variants.length ? 'Dodaj kolejną opcję' : 'Porównaj kilka opcji', 'form-add-option', {
              sub: f.variants.length ? '' : 'Np. modele w różnych cenach — wybrana wyznaczy cenę'
            })}</ul>
            <div class="card">
              <div class="field"><input class="input" type="url" inputmode="url" data-field="url" value="${esc(f.url)}" placeholder="Link (opcjonalnie)" aria-label="Link" autocapitalize="off" /></div>
              <div class="field"><input class="input" type="text" data-field="note" value="${esc(f.note)}" placeholder="Notatka (opcjonalnie)" aria-label="Notatka" maxlength="300" enterkeyhint="done" /></div>
            </div>
            ${isNew ? '' : `<ul class="card list">${actionRow('Usuń pozycję', 'delete-item', { tone: 'danger', attrs: `data-id="${esc(f.id)}"` })}</ul>`}
          </form>`
        };
      },

      buy(s) {
        const f = s.form;
        const it = findItem(s.id);
        if (!it) return null;
        const amount = parseNum(f.paid) || 0;
        return {
          title: 'Kupione',
          right: sheetBtn('Zapisz', 'sheet-save', true),
          body: `<form data-form novalidate>
            <p class="sheet-sub">${esc(it.name)}</p>
            <ul class="card list">
              <li class="row"><label class="row-text" for="b-paid"><span class="row-title">Zapłacono</span></label>
                <span class="money-input"><input id="b-paid" class="input-inline" type="text" inputmode="decimal" data-field="paid" value="${esc(f.paid)}" placeholder="0" /><span aria-hidden="true">zł</span></span></li>
              <li class="row"><label class="row-text" for="b-date"><span class="row-title">Data</span></label><input id="b-date" class="input-time" type="date" data-field="date" value="${esc(f.date)}" max="${state.today}" /></li>
              ${switchRow('W ratach', f.inst && amount ? `po ${fmtMoney(amount / f.count)} miesięcznie` : '', f.inst, 'form-toggle', 'inst')}
              ${f.inst ? `<li class="row"><span class="row-text"><span class="row-title">Liczba rat</span></span>${stepper(f.count, 'form-step', 'count', 'Liczba rat', 2, 48)}</li>` : ''}
            </ul>
            ${f.inst ? '<p class="group-note sheet-note">Do budżetu trafia tylko rata, od miesiąca zakupu.</p>' : ''}
          </form>`
        };
      },

      resign(s) {
        const f = s.form;
        const it = findItem(s.id);
        if (!it) return null;
        return {
          title: 'Rezygnacja',
          right: sheetBtn('Zapisz', 'sheet-save', true),
          body: `<form data-form novalidate>
            <p class="sheet-sub">„${esc(it.name)}” zniknie z listy. Zostanie w budżecie, w rezygnacjach z tego miesiąca.</p>
            <div class="card"><div class="field"><input class="input" type="text" data-field="reason" value="${esc(f.reason)}" placeholder="Powód (opcjonalnie)" aria-label="Powód" maxlength="140" enterkeyhint="done" /></div></div>
            <div class="chips wrap" role="group" aria-label="Szybki wybór powodu">${RESIGN_REASONS.map(
              (r) => `<button type="button" class="chip" data-action="pick-reason" data-value="${esc(r)}" aria-pressed="${f.reason === r}">${esc(r)}</button>`
            ).join('')}</div>
          </form>`
        };
      },

      category(s) {
        const f = s.form;
        const n = f.id ? state.items.filter((i) => i.category === f.original).length : 0;
        return {
          title: f.id ? 'Kategoria' : 'Nowa kategoria',
          right: sheetBtn(f.id ? 'Zapisz' : 'Dodaj', 'sheet-save', true),
          body: `<form data-form novalidate>
            ${f.error ? `<div class="alert" role="alert">${esc(f.error)}</div>` : ''}
            <div class="card"><div class="field"><input class="input" type="text" data-field="name" value="${esc(f.name)}" placeholder="Nazwa kategorii" aria-label="Nazwa kategorii" maxlength="40" enterkeyhint="done" data-autofocus /></div></div>
            ${
              f.id
                ? `${n ? `<p class="group-note sheet-note">${pl(n, 'pozycja', 'pozycje', 'pozycji')} w tej kategorii. Zmiana nazwy obejmie je wszystkie.</p>` : ''}
                   <ul class="card list">${actionRow('Usuń kategorię', 'delete-category', { tone: 'danger', sub: n ? 'Pozycje zostaną bez kategorii' : '' })}</ul>`
                : ''
            }
          </form>`
        };
      },

      importConfirm(s) {
        return alertSheet(
          'Przywrócić dane z kopii?',
          `Obecne pozycje (${state.items.length}) zostaną zastąpione zawartością pliku: ${pl(s.payload.items.length, 'pozycja', 'pozycje', 'pozycji')}.`,
          [
            ['Przywróć', 'import-confirm', 'btn-filled'],
            ['Anuluj', 'sheet-cancel', 'btn-gray']
          ]
        );
      },
      confirmClear() {
        return alertSheet('Usunąć wszystkie dane?', 'Tego nie da się cofnąć. Jeśli chcesz zachować pozycje, najpierw zapisz kopię.', [
          ['Usuń wszystko', 'clear-confirm', 'btn-danger'],
          ['Anuluj', 'sheet-cancel', 'btn-gray']
        ]);
      }
    };

    /* ---------- Otwieranie i zamykanie arkuszy ---------- */
    let lastOpener = null;
    function openSheet(type, data = {}) {
      if (!state.sheet && !lastOpener) lastOpener = document.activeElement;
      state.sheet = { type, ...data, closing: false, focusPending: true };
      render();
    }
    function pushSheet(type, data = {}) {
      const prev = state.sheet;
      state.sheet = { type, ...data, prev, closing: false, focusPending: true };
      render();
      const body = appRoot.querySelector('.sheet-body');
      if (body) body.scrollTop = 0;
    }
    function popSheet() {
      const prev = state.sheet && state.sheet.prev;
      if (!prev) {
        closeSheet();
        return;
      }
      state.sheet = { ...prev, focusPending: true };
      render();
    }
    function restoreFocus() {
      if (lastOpener && lastOpener.isConnected) lastOpener.focus({ preventScroll: true });
      lastOpener = null;
    }
    function closeSheet(immediate = false) {
      const s = state.sheet;
      if (!s || s.closing) return;
      if (immediate) {
        state.sheet = null;
        render();
        restoreFocus();
        return;
      }
      s.closing = true;
      render();
      const wide = window.matchMedia('(min-width: 44rem)').matches;
      setTimeout(
        () => {
          if (state.sheet === s) {
            state.sheet = null;
            render();
            restoreFocus();
          }
        },
        reduceMotion.matches ? 170 : wide ? 190 : 290
      );
    }
    const sheetDirty = () => Boolean(state.sheet && state.sheet.form && state.sheet.form.dirty);

    let drag = null;
    const rubber = (x) => (x * 0.55 * 300) / (300 + 0.55 * x);
    document.addEventListener('pointerdown', (e) => {
      const handle = e.target.closest('[data-drag-handle]');
      if (!handle || e.target.closest('button') || window.matchMedia('(min-width: 44rem)').matches) return;
      const sheet = handle.closest('.sheet');
      const scrim = sheet.parentElement.querySelector('.scrim');
      drag = { sheet, scrim, id: e.pointerId, startY: e.clientY, y: 0, pts: [{ y: e.clientY, t: e.timeStamp }] };
      handle.setPointerCapture(e.pointerId);
      sheet.style.transition = 'none';
      scrim.style.transition = 'none';
    });
    document.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      let dy = e.clientY - drag.startY;
      if (dy < 0) dy = -rubber(-dy);
      drag.y = dy;
      drag.sheet.style.transform = `translateY(${dy}px)`;
      drag.scrim.style.opacity = String(Math.max(0, 1 - Math.max(0, dy) / (drag.sheet.offsetHeight || 1)));
      drag.pts.push({ y: e.clientY, t: e.timeStamp });
      if (drag.pts.length > 6) drag.pts.shift();
    });
    function endDrag(e) {
      if (!drag || e.pointerId !== drag.id) return;
      const { sheet, scrim, pts, y } = drag;
      drag = null;
      const a = pts[0];
      const b = pts[pts.length - 1];
      const v = b.t > a.t ? (b.y - a.y) / (b.t - a.t) : 0;
      const h = sheet.offsetHeight || 1;
      if (!sheetDirty() && (y > h * 0.3 || (v > 0.5 && y > 8))) {
        const dur = Math.max(140, Math.min(320, (h - y) / Math.max(v, 1.2)));
        sheet.style.transition = `transform ${dur}ms cubic-bezier(0.2, 0.8, 0.3, 1)`;
        sheet.style.transform = 'translateY(100%)';
        scrim.style.transition = `opacity ${dur}ms ease`;
        scrim.style.opacity = '0';
        setTimeout(() => closeSheet(true), dur);
      } else {
        sheet.style.transition = 'transform 420ms var(--ease-drawer)';
        sheet.style.transform = 'translateY(0)';
        scrim.style.transition = 'opacity 300ms ease';
        scrim.style.opacity = '1';
        setTimeout(() => {
          if (!sheet.isConnected) return;
          sheet.style.removeProperty('transform');
          sheet.style.removeProperty('transition');
          scrim.style.removeProperty('opacity');
          scrim.style.removeProperty('transition');
        }, 440);
      }
    }
    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', endDrag);

    /* ============================================================
       Zapis pozycji
       ============================================================ */
    function upsertItem(rec) {
      rec.updatedAt = Date.now();
      const i = state.items.findIndex((x) => x.id === rec.id);
      if (i >= 0) state.items[i] = rec;
      else state.items.push(rec);
      return persist(dbPut('items', rec));
    }
    /* Zmiana z możliwością cofnięcia: zapisuje, zamyka arkusz, pokazuje toast. */
    function changeItem(id, mutate, message) {
      const prev = findItem(id);
      if (!prev) return;
      const before = JSON.parse(JSON.stringify(prev));
      const next = JSON.parse(JSON.stringify(prev));
      mutate(next);
      upsertItem(next);
      if (state.sheet) closeSheet();
      toast(message, async () => {
        await upsertItem(before);
        render();
      });
    }

    function openForm(it) {
      const stage = it ? it.stage : state.seg;
      const r = it && it.priceMode === 'range';
      const f = {
        id: it ? it.id : null,
        stage,
        name: it ? it.name : '',
        price: it ? inputNum(r ? it.priceMin || it.priceMax : it.price) : '',
        priceMax: it && r && num(it.priceMin) && num(it.priceMax) ? inputNum(it.priceMax) : '',
        paid: it ? inputNum(it.finalPrice) : '',
        category: it ? it.category : state.cat || '',
        necessary: it ? Boolean(it.necessary) : false,
        plannedMonth: it ? (stage === 'kupuje' ? effMonth(it) : it.plannedMonth) : stage === 'kupuje' ? curMonth() : '',
        inst: Boolean(it && it.installments && it.installments.enabled),
        count: it && it.installments ? Math.max(2, parseInt(it.installments.count, 10) || 3) : 3,
        variants: it ? (it.variants || []).map((v) => ({ id: v.id || generateId('opt'), name: v.name || '', price: inputNum(v.price), url: v.url || '', note: v.note || '', selected: Boolean(v.selected) })) : [],
        url: it ? it.url || '' : '',
        note: it ? it.note || '' : '',
        dirty: false,
        error: null
      };
      /* „Do 300 zł” z poprzedniej wersji: tylko górna granica */
      if (it && r && !num(it.priceMin) && num(it.priceMax)) {
        f.price = '';
        f.priceMax = inputNum(it.priceMax);
      }
      if (it && state.sheet && state.sheet.type === 'item') pushSheet('form', { form: f });
      else openSheet('form', { form: f });
    }
    async function saveForm() {
      const f = state.sheet.form;
      const name = f.name.trim();
      if (!name) {
        f.error = 'Wpisz nazwę.';
        render();
        return;
      }
      const prev = f.id ? findItem(f.id) : null;
      const it = prev
        ? JSON.parse(JSON.stringify(prev))
        : { id: generateId('item'), stage: f.stage, createdAt: state.today, completedAt: '', resolvedAt: '', finalPrice: '', resolutionNote: '' };
      it.name = name;
      const p1 = parseNum(f.price);
      const p2 = parseNum(f.priceMax);
      if (f.stage === 'kupione') {
        const v = parseNum(f.paid);
        it.finalPrice = v === null ? '' : v;
      }
      if (f.stage !== 'kupione' || !prev) {
        if (p2 !== null && p2 !== p1) {
          it.priceMode = 'range';
          it.priceMin = p1 === null ? '' : Math.min(p1, p2);
          it.priceMax = p1 === null ? p2 : Math.max(p1, p2);
          it.price = '';
        } else {
          it.priceMode = 'exact';
          it.price = p1 === null ? '' : p1;
          it.priceMin = '';
          it.priceMax = '';
        }
      }
      it.category = f.category;
      it.necessary = f.necessary;
      if (ACTIVE.includes(f.stage)) it.plannedMonth = f.plannedMonth || '';
      it.installments = { enabled: Boolean(f.inst), count: f.count };
      it.variants = f.variants
        .map((v) => ({ id: v.id, name: v.name.trim(), price: parseNum(v.price) ?? '', url: v.url.trim(), note: v.note || '', selected: v.selected }))
        .filter((v) => v.name || v.price !== '' || v.url);
      it.url = f.url.trim();
      it.note = f.note.trim();
      await upsertItem(it);
      if (state.sheet.prev) popSheet();
      else closeSheet();
      if (!prev) toast(f.stage === 'kupuje' ? 'Dodano do „Kupuję”' : 'Dodano do listy');
    }

    function openBuy(id) {
      const it = findItem(id);
      if (!it) return;
      const f = {
        paid: inputNum(it.stage === 'kupione' && num(it.finalPrice) ? it.finalPrice : itemCost(it)),
        date: it.stage === 'kupione' && isDate(it.completedAt) ? it.completedAt : state.today,
        inst: Boolean(it.installments && it.installments.enabled),
        count: Math.max(2, parseInt(it.installments && it.installments.count, 10) || 3),
        dirty: false
      };
      if (state.sheet && state.sheet.type === 'item') pushSheet('buy', { id, form: f });
      else openSheet('buy', { id, form: f });
    }
    function saveBuy() {
      const { id, form: f } = state.sheet;
      const it = findItem(id);
      const wasBought = it && it.stage === 'kupione';
      changeItem(
        id,
        (x) => {
          x.stage = 'kupione';
          const v = parseNum(f.paid);
          x.finalPrice = v === null ? '' : v;
          x.completedAt = isDate(f.date) && f.date <= state.today ? f.date : state.today;
          x.installments = { enabled: Boolean(f.inst), count: f.count };
          x.resolvedAt = '';
        },
        wasBought ? 'Zapisano zmiany' : 'Zapisano jako kupione'
      );
    }

    /* ============================================================
       Pliki: kopia zapasowa
       ============================================================ */
    async function deliverFile(name, mime, content) {
      const blob = new Blob([content], { type: mime });
      const touch = window.matchMedia('(pointer: coarse)').matches;
      if (touch && navigator.canShare && typeof File === 'function') {
        try {
          const file = new File([blob], name, { type: mime });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file] });
            return true;
          }
        } catch (err) {
          if (err && err.name === 'AbortError') return false;
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      return true;
    }
    function validateBackup(raw) {
      if (!raw || typeof raw !== 'object') throw new Error('To nie jest plik kopii.');
      if (raw.app !== 'Konsumpcja') throw new Error('Ten plik nie jest kopią Konsumpcji.');
      if (!Array.isArray(raw.items)) throw new Error('Kopia jest niekompletna.');
      const categories = (Array.isArray(raw.categories) ? raw.categories : [])
        .map((c, i) => {
          if (typeof c === 'string') return { id: generateId('cat'), name: c, order: i };
          if (c && typeof c.name === 'string') return { id: typeof c.id === 'string' ? c.id : generateId('cat'), name: c.name, order: Number.isFinite(c.order) ? c.order : i };
          return null;
        })
        .filter(Boolean);
      return {
        items: raw.items.filter((x) => x && typeof x.id === 'string' && typeof x.name === 'string'),
        categories,
        settings: { ...DEFAULT_SETTINGS, ...(raw.settings || {}), id: 'user_settings' }
      };
    }

    /* ============================================================
       Akcje
       ============================================================ */
    const form = () => state.sheet && state.sheet.form;
    const ACTIONS = {
      tab(el) {
        const next = el.dataset.tab;
        if (next === state.tab) {
          window.scrollTo({ top: 0, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
          return;
        }
        state.scroll[state.tab] = window.scrollY;
        state.tab = next;
        if (next === 'budget') state.month = curMonth();
        render();
        window.scrollTo(0, next === 'budget' ? 0 : state.scroll[next] || 0);
        updateScrolled();
      },
      'set-seg'(el) {
        state.seg = el.dataset.value;
        render();
      },
      'set-cat'(el) {
        state.cat = el.dataset.value;
        render();
      },
      'new-item'() {
        openForm(null);
      },
      'open-item'(el) {
        openSheet('item', { id: el.dataset.id });
      },
      'edit-item'(el) {
        const it = findItem(el.dataset.id);
        if (it) openForm(it);
      },
      'move-kupuje'(el) {
        const cur = curMonth();
        changeItem(
          el.dataset.id,
          (x) => {
            x.stage = 'kupuje';
            if (!(isMonth(x.plannedMonth) && x.plannedMonth >= cur)) x.plannedMonth = cur;
          },
          'Przeniesiono do „Kupuję”'
        );
      },
      'move-lista'(el) {
        changeItem(
          el.dataset.id,
          (x) => {
            x.stage = 'lista';
          },
          'Przeniesiono na listę'
        );
      },
      buy(el) {
        openBuy(el.dataset.id);
      },
      unbuy(el) {
        const cur = curMonth();
        changeItem(
          el.dataset.id,
          (x) => {
            x.stage = 'kupuje';
            x.completedAt = '';
            x.finalPrice = '';
            if (!(isMonth(x.plannedMonth) && x.plannedMonth >= cur)) x.plannedMonth = cur;
          },
          'Cofnięto zakup'
        );
      },
      resign(el) {
        pushSheet('resign', { id: el.dataset.id, form: { reason: '', dirty: false } });
      },
      restore(el) {
        changeItem(
          el.dataset.id,
          (x) => {
            x.stage = 'lista';
            x.resolvedAt = '';
            x.resolutionNote = '';
          },
          'Przywrócono na listę'
        );
      },
      'pick-reason'(el) {
        const f = form();
        f.reason = f.reason === el.dataset.value ? '' : el.dataset.value;
        render();
      },
      'toggle-necessary'(el) {
        const it = findItem(el.dataset.id);
        if (!it) return;
        upsertItem({ ...it, necessary: !it.necessary });
        render();
      },
      'pick-option'(el) {
        const it = findItem(el.dataset.id);
        if (!it) return;
        const next = JSON.parse(JSON.stringify(it));
        next.variants.forEach((v) => {
          v.selected = v.id === el.dataset.opt ? !v.selected : false;
        });
        upsertItem(next);
        render();
      },
      'delete-item'(el) {
        const it = findItem(el.dataset.id);
        if (!it) return;
        state.items = state.items.filter((x) => x.id !== it.id);
        persist(dbDelete('items', it.id));
        state.sheet = null;
        render();
        restoreFocus();
        toast('Usunięto pozycję', async () => {
          await upsertItem(it);
          render();
        });
      },

      'form-toggle'(el) {
        const f = form();
        f[el.dataset.key] = !f[el.dataset.key];
        f.dirty = true;
        render();
      },
      'form-step'(el) {
        const f = form();
        f.count = Math.max(2, Math.min(48, f.count + Number(el.dataset.delta)));
        f.dirty = true;
        render();
      },
      'form-add-option'() {
        const f = form();
        f.variants.push({ id: generateId('opt'), name: '', price: '', url: '', note: '', selected: f.variants.length === 0 });
        f.dirty = true;
        render();
        const inputs = appRoot.querySelectorAll('.sheet [data-var$=":name"]');
        if (inputs.length) inputs[inputs.length - 1].focus();
      },
      'form-remove-option'(el) {
        const f = form();
        const removed = f.variants.splice(Number(el.dataset.index), 1)[0];
        if (removed && removed.selected && f.variants.length) f.variants[0].selected = true;
        f.dirty = true;
        render();
      },
      'form-pick-option'(el) {
        const f = form();
        const i = Number(el.dataset.index);
        f.variants.forEach((v, j) => {
          v.selected = j === i ? !v.selected : false;
        });
        f.dirty = true;
        render();
      },

      'sheet-save'() {
        const s = state.sheet;
        if (!s) return;
        if (s.type === 'form') return saveForm();
        if (s.type === 'buy') return saveBuy();
        if (s.type === 'resign') {
          const reason = (s.form.reason || '').trim();
          return changeItem(
            s.id,
            (x) => {
              x.stage = 'rezygnacja';
              x.resolvedAt = state.today;
              x.resolutionNote = reason;
            },
            'Zapisano rezygnację'
          );
        }
        if (s.type === 'category') return saveCategory();
      },
      'sheet-cancel'() {
        if (state.sheet && state.sheet.prev) popSheet();
        else closeSheet();
      },
      'sheet-dismiss'() {
        if (sheetDirty()) return;
        closeSheet();
      },

      'month-shift'(el) {
        state.month = addMonths(state.month, Number(el.dataset.dir));
        render();
      },
      'month-today'() {
        state.month = curMonth();
        render();
      },

      'set-theme'(el) {
        updateSettings({ theme: el.dataset.value });
      },
      'toggle-setting'(el) {
        const k = el.dataset.key;
        updateSettings({ [k]: state.settings[k] === false });
      },
      'set-cooling'(el) {
        updateSettings({ coolingDaysHighlight: Number(el.dataset.value) || 14 });
      },
      'new-category'() {
        openSheet('category', { form: { id: null, name: '', original: '', error: null, dirty: false } });
      },
      'edit-category'(el) {
        const c = state.categories.find((x) => x.id === el.dataset.id);
        if (c) openSheet('category', { form: { id: c.id, name: c.name, original: c.name, error: null, dirty: false } });
      },
      'delete-category'() {
        const f = form();
        const c = state.categories.find((x) => x.id === f.id);
        if (!c) return;
        const affected = state.items.filter((i) => i.category === c.name).map((i) => ({ ...i }));
        state.categories = state.categories.filter((x) => x.id !== c.id);
        persist(dbDelete('categories', c.id));
        affected.forEach((i) => upsertItem({ ...i, category: '' }));
        if (state.cat === c.name) state.cat = '';
        state.sheet = null;
        render();
        toast('Usunięto kategorię', async () => {
          state.categories.push(c);
          state.categories.sort((a, b) => a.order - b.order);
          await persist(dbPut('categories', c));
          await Promise.all(affected.map((i) => upsertItem(i)));
          render();
        });
      },

      async 'export-json'() {
        const payload = {
          app: 'Konsumpcja',
          appVersion: APP_VERSION,
          schemaVersion: MODEL_VERSION,
          exportedAt: new Date().toISOString(),
          items: state.items,
          categories: state.categories,
          settings: state.settings
        };
        const ok = await deliverFile(`konsumpcja-kopia-${state.today}.json`, 'application/json', JSON.stringify(payload, null, 2));
        if (ok) toast('Kopia gotowa');
      },
      'import-json'() {
        document.getElementById('backup-input').click();
      },
      async 'import-confirm'() {
        const p = state.sheet && state.sheet.payload;
        if (!p) return;
        await persist(
          dbTx(STORES, (t) => {
            STORES.forEach((s) => t.objectStore(s).clear());
            p.items.forEach((x) => t.objectStore('items').put(x));
            p.categories.forEach((x) => t.objectStore('categories').put(x));
            t.objectStore('settings').put(p.settings);
          })
        );
        closeSheet(true);
        await loadAll();
        toast('Przywrócono dane z kopii');
      },
      'clear-all'() {
        openSheet('confirmClear');
      },
      async 'clear-confirm'() {
        await persist(dbTx(STORES, (t) => STORES.forEach((s) => t.objectStore(s).clear())));
        closeSheet(true);
        await loadAll();
        toast('Usunięto wszystkie dane');
      },
      async 'toast-undo'() {
        const t = state.toast;
        if (!t || !t.undo) return;
        const fn = t.undo;
        t.undo = null;
        dismissToast();
        await fn();
      }
    };

    async function saveCategory() {
      const f = form();
      const name = f.name.trim().replace(/\s+/g, ' ');
      if (!name) {
        f.error = 'Wpisz nazwę.';
        render();
        return;
      }
      if (state.categories.some((c) => c.id !== f.id && c.name.toLowerCase() === name.toLowerCase())) {
        f.error = 'Taka kategoria już jest.';
        render();
        return;
      }
      if (f.id) {
        const c = state.categories.find((x) => x.id === f.id);
        if (c && c.name !== name) {
          const old = c.name;
          c.name = name;
          await persist(dbPut('categories', c));
          await Promise.all(state.items.filter((i) => i.category === old).map((i) => upsertItem({ ...i, category: name })));
          if (state.cat === old) state.cat = name;
        }
      } else {
        const c = { id: generateId('cat'), name, order: state.categories.reduce((m, x) => Math.max(m, x.order), -1) + 1 };
        state.categories.push(c);
        await persist(dbPut('categories', c));
      }
      closeSheet();
    }

    async function updateSettings(partial) {
      state.settings = { ...state.settings, ...partial, id: 'user_settings' };
      if ('theme' in partial) applyTheme();
      render();
      await persist(dbPut('settings', state.settings));
    }

    document.addEventListener('click', async (e) => {
      const el = e.target.closest('[data-action]');
      if (!el || el.disabled || !appRoot.contains(el)) return;
      const fn = ACTIONS[el.dataset.action];
      if (!fn) return;
      e.preventDefault();
      try {
        await fn(el, e);
      } catch (err) {
        console.error(err);
        toast('Coś poszło nie tak. Spróbuj ponownie.');
      }
    });
    document.addEventListener('submit', (e) => {
      if (!e.target.matches('[data-form]')) return;
      e.preventDefault();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      ACTIONS['sheet-save']();
    });
    const LIVE_FIELDS = ['paid', 'price', 'priceMax'];
    document.addEventListener('input', (e) => {
      const el = e.target;
      if (!el.dataset) return;
      if ('setting' in el.dataset) {
        const v = parseNum(el.value);
        state.settings[el.dataset.setting] = v === null ? 0 : v;
        clearTimeout(window.__kSettingTimer);
        window.__kSettingTimer = setTimeout(() => persist(dbPut('settings', state.settings)), 400);
        return;
      }
      const f = form();
      if (!f) return;
      if ('var' in el.dataset) {
        const [i, key] = el.dataset.var.split(':');
        const v = f.variants[Number(i)];
        if (!v) return;
        v[key] = el.value;
        f.dirty = true;
        if (key === 'price') render();
        return;
      }
      const key = el.dataset.field;
      if (!key) return;
      f[key] = el.value;
      f.dirty = true;
      if (f.error) {
        f.error = null;
        render();
      } else if (LIVE_FIELDS.includes(key)) render();
    });
    document.addEventListener('change', (e) => {
      const el = e.target;
      if (el.id === 'backup-input') return;
      if (el.dataset && el.dataset.termin) {
        const it = findItem(el.dataset.termin);
        if (!it) return;
        upsertItem({ ...it, plannedMonth: el.value });
        render();
        return;
      }
      if (el.dataset && el.dataset.setting) {
        render();
        return;
      }
      if (el.dataset && el.dataset.field && form()) render();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing && e.target.matches && e.target.matches('[data-form] input')) {
        e.preventDefault();
        if (e.target.blur) e.target.blur();
        ACTIONS['sheet-save']();
        return;
      }
      if (e.key !== 'Escape') return;
      if (state.sheet) ACTIONS['sheet-cancel']();
    });
    document.getElementById('backup-input').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      try {
        const payload = validateBackup(JSON.parse(await file.text()));
        openSheet('importConfirm', { payload });
      } catch (err) {
        toast(err instanceof SyntaxError ? 'Nie da się odczytać tego pliku.' : err.message);
      }
    });

    /* ============================================================
       Start
       ============================================================ */
    async function loadAll() {
      try {
        const [items, cats, settingsList] = await Promise.all(STORES.map(dbGetAll));
        const saved = settingsList.find((s) => s.id === 'user_settings');
        const settings = { ...DEFAULT_SETTINGS, ...(saved || {}), id: 'user_settings' };
        ['currency', 'includeConsideringInBar', 'defaultStage'].forEach((k) => delete settings[k]);
        settings.modelVersion = MODEL_VERSION;
        state.today = toDateStr();
        const cur = curMonth();

        const changed = [];
        const list = items.map((raw) => {
          const r = migrateItem(raw, cur);
          if (r.changed) changed.push(r.it);
          return r.it;
        });
        if (changed.length) {
          /* Jednorazowa kopia sprzed zmiany modelu, na wszelki wypadek — tylko w pamięci telefonu. */
          if (!settingsList.some((s) => s.id === 'backup_before_1_0_1')) {
            await dbPut('settings', { id: 'backup_before_1_0_1', savedAt: new Date().toISOString(), items });
          }
          await dbPutMany('items', changed);
        }

        let categories = cats.filter((c) => c && typeof c.name === 'string');
        if (!categories.length && !saved) {
          categories = DEFAULT_CATEGORIES.map((name, i) => ({ id: generateId('cat'), name, order: i }));
          await dbPutMany('categories', categories);
        } else {
          const fix = [];
          const seen = new Set();
          categories = categories.filter((c) => {
            const k = c.name.toLowerCase();
            if (seen.has(k)) return false;
            seen.add(k);
            return true;
          });
          categories.forEach((c, i) => {
            if (!Number.isFinite(c.order)) {
              const d = DEFAULT_CATEGORIES.indexOf(c.name);
              c.order = d >= 0 ? d : 100 + i;
              fix.push(c);
            }
          });
          categories.sort((a, b) => a.order - b.order);
          if (fix.length) await dbPutMany('categories', fix);
        }
        if (JSON.stringify(settings) !== JSON.stringify(saved || null)) await dbPut('settings', settings);

        state.items = list;
        state.categories = categories;
        state.settings = settings;
        state.month = cur;
        state.ready = true;
        applyTheme();
        render();
      } catch (err) {
        state.error = err && err.message ? err.message : 'Nieznany błąd bazy danych.';
        render();
      }
    }

    function refreshToday() {
      const t = toDateStr();
      if (t === state.today) return;
      const prevMonth = curMonth();
      state.today = t;
      if (state.month === prevMonth) state.month = curMonth();
      render();
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshToday();
    });
    setInterval(refreshToday, 60000);

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

    window.__konsumpcja = { state, migrateItem, monthSummary, itemCost };
    loadAll();
  })();

  </script>
